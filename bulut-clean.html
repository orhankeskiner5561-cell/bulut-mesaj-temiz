<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d8cff">
<title>BULUT</title>
<link rel="stylesheet" href="./bulut-clean.css">
<link rel="stylesheet" href="./bulut-auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="cloudLogo" viewBox="0 0 100 70" role="img" aria-label="Gülen Bulut">
      <defs><linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.72" stop-color="#f7feff"/><stop offset="1" stop-color="#cceff8"/></linearGradient></defs>
      <path class="spark" d="M12 10 l2.3 5.2 5.2 2.3-5.2 2.3L12 25l-2.3-5.2-5.2-2.3 5.2-2.3z"/>
      <path class="spark two" d="M88 17 l1.8 4 4 1.8-4 1.8-1.8 4-1.8-4-4-1.8 4-1.8z"/>
      <path class="cloudBody" d="M23 56 C13 56 7 49 7 40 C7 31 14 24 23 24 C25 13 34 6 45 6 C57 6 66 14 68 25 C72 22 77 20 82 20 C91 20 98 28 98 38 C98 48 90 56 80 56 Z"/>
      <ellipse class="eyeOpen" cx="38" cy="35" rx="5.4" ry="6.8"/><circle class="eyeShine" cx="36.5" cy="32.8" r="1.7"/>
      <path class="eyeWink" d="M56 35 Q62 30 68 35"/>
      <ellipse class="cheek" cx="27" cy="44" rx="6.5" ry="3.5"/><ellipse class="cheek" cx="76" cy="44" rx="6.5" ry="3.5"/>
      <path class="mouth" d="M44 43 Q52 51 60 43 L60 47 Q52 57 44 47 Z"/><ellipse class="tongue" cx="52" cy="49" rx="4.3" ry="2.2"/>
    </svg>
    <span class="brandName">BULUT</span><span class="brandTr">TR</span><span class="brandFlag">🇹🇷</span>
  </div>
  <div class="actions"><button class="ib" id="bell">🔔<span class="badge" id="badge" hidden>0</span></button><button class="ib" data-route="messages">💬</button><button class="ib" data-route="profile">👤</button></div>
</header>
<main class="wrap">
  <section class="page on" id="home"><div class="card"><h2 style="margin-top:0">Ana Akış</h2><div id="feed"><div class="loading">Yükleniyor…</div></div></div></section>
  <section class="page" id="reels"><div class="card"><h2>Reels</h2><div id="reelFeed"><div class="loading">Yükleniyor…</div></div></div></section>
  <section class="page" id="agenda"><div class="card"><h2>Gündem</h2><p class="muted">Gündem alanı hazır.</p></div></section>
  <section class="page" id="rooms"><div class="card"><h2>Odalar</h2><p class="muted">Sohbet odaları alanı hazır.</p></div></section>
  <section class="page" id="messages">
    <div class="card" id="chatListCard"><div class="mh"><div><h2 style="margin:0">Mesajlar</h2><p class="muted" style="margin:4px 0 0">Tek kişi = tek sohbet</p></div><button class="ib" id="refreshChats">↻</button></div><div id="chatList"></div></div>
    <div class="card chatPanel" id="chatPanel" hidden><div class="chatHead"><button class="ib" id="chatBack">←</button><div class="av clickable" id="chatAvatar">?</div><div class="clickable" id="chatIdentity"><b id="chatName">Sohbet</b><div class="muted" id="chatUser"></div></div></div><div class="chatMessages" id="chatMessages"></div><form class="chatComposer" id="chatForm"><textarea id="chatInput" rows="1" maxlength="2000" placeholder="Mesaj yaz..."></textarea><button class="primary">Gönder</button></form></div>
  </section>
  <section class="page" id="profile"><div class="card profileBox" id="profileBox"><div class="loading">Profil yükleniyor…</div></div></section>
</main>
<nav class="bottom"><button data-route="home" class="on"><span>🏠</span>Ana Akış</button><button data-route="reels"><span>🎬</span>Reels</button><button data-route="agenda"><span>🔥</span>Gündem</button><button data-route="rooms"><span>💬</span>Odalar</button><button data-route="profile"><span>👤</span>Profil</button></nav>
<div class="modal" id="notifModal"><div class="backdrop" data-close="notifModal"></div><div class="box"><div class="mh"><h2>Bildirimler</h2><button class="ib" data-close="notifModal">✕</button></div><div id="notifContent"></div></div></div>
<div class="toast" id="toast"></div>
<script src="./bulut-clean.js"></script>
<script src="./bulut-auth.js"></script>
</body>
</html>
