<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VİTRİN Tam Müzik Testi</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#fff;font-family:system-ui;padding:18px}.wrap{max-width:720px;margin:auto}.brand{text-align:center;margin:8px 0 18px}.v{font:900 70px Georgia;color:#D4AF37;text-shadow:0 2px 0 #8b6914,0 7px 14px #000}.brand b{display:block;font-size:24px}.card{border:2px solid #6e5620;border-radius:20px;background:#111;padding:14px}.search{width:100%;padding:14px;border:1px solid #73591e;border-radius:14px;background:#080808;color:#fff;font-size:17px}.hint{font-size:11px;color:#b9aa80;line-height:1.45;margin:8px 0 12px}.list{display:grid;gap:8px;max-height:65vh;overflow:auto}.track{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:center;border:1px solid #4e3c18;border-radius:14px;padding:9px;background:#151515}.track img{width:50px;height:50px;object-fit:cover;border-radius:10px}.track b{font-size:13px}.track small{display:block;color:#aaa080;font-size:10px;margin-top:3px}.track button{border:0;border-radius:10px;background:#D4AF37;color:#111;font-weight:900;padding:10px}.status{text-align:center;color:#c8b985;padding:16px}.now{margin:12px 0;padding:12px;border:1px solid #6e5620;border-radius:14px;background:#171717}.now small{display:block;color:#c8b985}.lic{display:inline-block;margin-top:4px;font-size:9px;color:#e7c85f;border:1px solid #6e5620;border-radius:999px;padding:2px 6px}audio{width:100%;margin-top:10px}</style></head><body><div class="wrap"><div class="brand"><span class="v">V</span><b>VİTRİN</b><small>Ücretsiz Tam Müzik Testi</small></div><div class="card"><input id="q" class="search" placeholder="Şarkı, sanatçı veya tür ara…"><div class="hint">Jamendo'nun test geliştirici erişimi kullanılıyor. Sonuçlardaki ses dosyaları mevcutsa 0:00'dan sonuna kadar oynar. Bu sayfa sadece yeni test dalındadır; ana site ve mevcut müzik sistemi değişmedi.</div><div id="now" class="now">Henüz şarkı seçilmedi.<audio id="audio" controls preload="metadata"></audio></div><div id="out"><div class="status">Arama yapmak için en az 2 harf yazın.</div></div></div></div><script>const CID='709fa152',q=document.getElementById('q'),out=document.getElementById('out'),audio=document.getElementById('audio'),now=document.getElementById('now');let tmr=0,tracks=[];const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function lic(u){return String(u||'Creative Commons').replace('http://creativecommons.org/licenses/','CC ').replace('https://creativecommons.org/licenses/','CC ').replace(/\/$/,'')}async function search(s){if(s.length<2){out.innerHTML='<div class="status">Arama yapmak için en az 2 harf yazın.</div>';return}out.innerHTML='<div class="status">Tam parçalar aranıyor…</div>';try{const r=await fetch('https://api.jamendo.com/v3.0/tracks/?client_id='+CID+'&format=json&limit=50&audioformat=mp32&imagesize=100&include=licenses&search='+encodeURIComponent(s)),j=await r.json();tracks=(j.results||[]).filter(x=>x.audio);if(!tracks.length){out.innerHTML='<div class="status">Sonuç bulunamadı.</div>';return}out.innerHTML='<div class="list">'+tracks.map(x=>'<div class="track"><img src="'+esc(x.image||x.album_image||'')+'"><span><b>'+esc(x.name)+'</b><small>'+esc(x.artist_name)+' · '+Math.floor((+x.duration||0)/60)+':'+String((+x.duration||0)%60).padStart(2,'0')+'</small><span class="lic">'+esc(lic(x.license_ccurl))+'</span></span><button data-id="'+esc(x.id)+'">TAM DİNLE</button></div>').join('')+'</div>';out.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>play(tracks.find(x=>String(x.id)===b.dataset.id)))}catch(e){out.innerHTML='<div class="status">Jamendo bağlantısı kurulamadı. Tekrar deneyin.</div>'}}function play(x){if(!x)return;audio.src=x.audio;audio.currentTime=0;audio.play().catch(()=>{});now.childNodes[0].nodeValue='🎵 '+x.name+' — '+x.artist_name+' ';}q.oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>search(e.target.value.trim()),500)};</script></body></html>
