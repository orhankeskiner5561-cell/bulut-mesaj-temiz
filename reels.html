<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2d8cff">
<title>BULUT - Reels</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7ff;color:#10233f;padding-bottom:86px}.top{height:88px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #dfeaf6;position:sticky;top:0;z-index:20}.brand{font-size:27px;font-weight:800}.actions{display:flex;gap:9px}.action{border:0;background:#f0f7ff;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:23px;text-decoration:none;color:#10233f}.page{max-width:650px;margin:auto;padding:18px 14px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.headrow h1{font-size:30px;margin:0}.upload{border:0;border-radius:16px;padding:12px 15px;font-size:15px;font-weight:800;background:#2d8cff;color:#fff}.upload:disabled{opacity:.6}.composer{background:#fff;border:1px solid #dfeaf6;border-radius:20px;padding:14px;margin-bottom:16px;display:none}.composer.on{display:block}.composer textarea{width:100%;min-height:76px;resize:vertical;border:1px solid #dfeaf6;border-radius:13px;padding:11px;font:inherit}.composer .row{display:flex;gap:8px;margin-top:9px}.composer button{flex:1;border:0;border-radius:13px;padding:11px;font-weight:800}.primary{background:#2d8cff;color:white}.secondary{background:#f0f7ff;color:#10233f}.status{padding:14px;text-align:center;color:#71829a}.reel{height:72vh;min-height:520px;max-height:760px;border-radius:28px;overflow:hidden;position:relative;background:#172331;box-shadow:0 5px 18px rgba(0,0,0,.12);margin-bottom:18px}.reel video{width:100%;height:100%;object-fit:cover;background:#222}.shade{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.76));pointer-events:none}.info{position:absolute;left:20px;right:82px;bottom:24px;color:white;text-shadow:0 2px 5px #000}.user{font-size:20px;font-weight:800;margin-bottom:7px}.caption{font-size:16px;line-height:1.35;white-space:pre-wrap}.side{position:absolute;right:13px;bottom:23px;display:flex;flex-direction:column;gap:13px;align-items:center}.side button{border:0;background:rgba(0,0,0,.38);color:white;width:52px;height:52px;border-radius:50%;font-size:23px}.side button.liked{background:#d92d4b}.count{color:white;font-weight:700;font-size:12px;text-shadow:0 1px 4px #000;margin-top:-9px}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #dfeaf6;display:flex;justify-content:space-around;align-items:center;z-index:30}.nav{text-align:center;color:#7d8794;font-size:13px;text-decoration:none}.nav span{display:block;font-size:27px;margin-bottom:3px}.nav.active{color:#2d8cff;font-weight:bold}.empty{background:#fff;border:1px solid #dfeaf6;border-radius:20px;padding:30px;text-align:center;color:#71829a}@media(max-width:420px){.brand{font-size:22px}.top{padding:10px}.actions{gap:5px}.action{width:42px;height:42px}.headrow h1{font-size:27px}.upload{padding:10px 12px}.reel{min-height:500px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top"><div class="brand">☁️ BULUT 🇹🇷 TR</div><div class="actions"><a class="action" href="index.html#home">🔎</a><a class="action" href="index.html#home">🔔</a><a class="action" href="index.html#messages">💬</a></div></header>
<main class="page">
<div class="headrow"><h1>Reels / Keşfet</h1><button class="upload" id="pickBtn">＋ Reel Yükle</button></div>
<div class="composer" id="composer"><div id="chosen" style="font-weight:700;margin-bottom:8px">Video seçilmedi</div><textarea id="caption" maxlength="500" placeholder="Açıklama yazın... #keşfet"></textarea><div class="row"><button class="secondary" id="cancelBtn">İptal</button><button class="primary" id="publishBtn">Yayınla</button></div></div>
<input id="file" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-m4v,video/*" hidden>
<div id="feed"><div class="status">Reels yükleniyor…</div></div>
</main>
<nav class="bottom"><a class="nav" href="index.html#home"><span>🏠</span>Ana Akış</a><a class="nav active" href="reels.html"><span>🎬</span>Reels</a><a class="nav" href="index.html#agenda"><span>🔥</span>Gündem</a><a class="nav" href="index.html#rooms"><span>💬</span>Odalar</a><a class="nav" href="index.html#profile"><span>👤</span>Profil</a></nav>
<script>
const SUPABASE_URL='https://wtkiozzylhvphxenrpwq.supabase.co';
const SUPABASE_KEY='sb_publishable_pDW5FSXya-HqQDl4pI4lAQ_Hdm7yptb';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session=null,selectedFile=null,reels=[],likes=[],profiles={};
async function init(){const r=await sb.auth.getSession();session=r.data.session;await loadAll();sb.auth.onAuthStateChange(async(_e,s)=>{session=s;await loadAll()});}
async function loadAll(){$('#feed').innerHTML='<div class="status">Reels yükleniyor…</div>';const [rr,lr,pr]=await Promise.all([sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(100),sb.from('reel_likes').select('reel_id,user_id'),sb.from('profiles').select('id,full_name,username,avatar_url')]);if(rr.error){console.error(rr.error);$('#feed').innerHTML='<div class="empty">Reels yüklenemedi.</div>';return}reels=rr.data||[];likes=lr.data||[];profiles=Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));render();}
function render(){if(!reels.length){$('#feed').innerHTML='<div class="empty">Henüz Reel yok. İlk videoyu siz yükleyin ☁️</div>';return}$('#feed').innerHTML=reels.map(r=>{const p=profiles[r.user_id]||{username:'bulut'};const count=likes.filter(x=>x.reel_id===r.id).length;const liked=!!(session&&likes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id));return `<article class="reel" data-id="${r.id}"><video src="${esc(r.video_url)}" controls playsinline loop preload="metadata"></video><div class="shade"></div><div class="info"><div class="user">@${esc(p.username||'bulut')}</div><div class="caption">${esc(r.caption||'BULUT Reels ☁️')}</div></div><div class="side"><button class="${liked?'liked':''}" data-like="${r.id}">❤️</button><div class="count">${count}</div><button data-share="${r.id}">↗️</button></div></article>`;}).join('');document.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareReel(b.dataset.share));}
$('#pickBtn').onclick=()=>{if(!session){alert('Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return}$('#file').click();};
$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;selectedFile=f;const mb=(f.size/1024/1024).toFixed(1);$('#chosen').textContent=f.size>48*1024*1024?'Seçildi: '+f.name+' · '+mb+' MB · Kalite korunarak otomatik sıkıştırılacak':'Seçildi: '+f.name+' · '+mb+' MB';$('#composer').classList.add('on');};
$('#cancelBtn').onclick=()=>{selectedFile=null;$('#file').value='';$('#caption').value='';$('#composer').classList.remove('on')};
async function compressVideoIfNeeded(file){
 const limit=48*1024*1024;
 if(file.size<=limit)return file;
 const chosen=$('#chosen');
 chosen.textContent='Video boyutu kalite korunarak sıkıştırılıyor…';
 if(typeof MediaRecorder==='undefined')throw new Error('Bu tarayıcı otomatik video sıkıştırmayı desteklemiyor.');
 const url=URL.createObjectURL(file);
 const video=document.createElement('video');
 video.src=url;video.preload='metadata';video.playsInline=true;video.muted=true;
 video.style.cssText='position:fixed;left:-99999px;top:-99999px;width:1px;height:1px;opacity:0;pointer-events:none';
 document.body.appendChild(video);
 try{
  await new Promise((resolve,reject)=>{video.onloadedmetadata=resolve;video.onerror=()=>reject(new Error('Video okunamadı'))});
  const duration=Number(video.duration);
  if(!Number.isFinite(duration)||duration<=0)throw new Error('Video süresi okunamadı');
  const maxW=1080,maxH=1920;
  const scale=Math.min(1,maxW/video.videoWidth,maxH/video.videoHeight);
  const w=Math.max(2,Math.floor(video.videoWidth*scale/2)*2),h=Math.max(2,Math.floor(video.videoHeight*scale/2)*2);
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:false});
  const out=canvas.captureStream(30);
  const source=video.captureStream?video.captureStream():(video.mozCaptureStream?video.mozCaptureStream():null);
  if(source)source.getAudioTracks().forEach(t=>out.addTrack(t));
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
  const targetBytes=46*1024*1024,audioRate=128000;
  let videoRate=Math.floor((targetBytes*8/duration)-audioRate);
  videoRate=Math.max(750000,Math.min(8000000,videoRate));
  const opts={videoBitsPerSecond:videoRate,audioBitsPerSecond:audioRate};if(mime)opts.mimeType=mime;
  const rec=new MediaRecorder(out,opts),chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=e=>reject(e.error||new Error('Sıkıştırma başarısız'))});
  let last=-1;
  const draw=()=>{if(video.readyState>=2)ctx.drawImage(video,0,0,w,h);const pct=Math.min(99,Math.floor((video.currentTime/duration)*100));if(pct!==last){last=pct;chosen.textContent='Video boyutu kalite korunarak sıkıştırılıyor… %'+pct}if(!video.ended)requestAnimationFrame(draw)};
  rec.start(1000);await video.play();draw();
  await new Promise((resolve,reject)=>{video.onended=resolve;video.onerror=()=>reject(new Error('Sıkıştırma sırasında video okunamadı'))});
  rec.stop();await stopped;
  const blob=new Blob(chunks,{type:mime||'video/webm'});
  if(!blob.size)throw new Error('Sıkıştırılmış video oluşturulamadı');
  if(blob.size>49*1024*1024)throw new Error('Video kalite korunarak sıkıştırıldı fakat hâlâ 50 MB sınırının üzerinde. Daha kısa bir video deneyin.');
  const base=(file.name||'reel').replace(/\.[^.]+$/,'');
  chosen.textContent='Sıkıştırma tamamlandı · '+(blob.size/1024/1024).toFixed(1)+' MB · 1080p kalite öncelikli';
  return new File([blob],base+'-bulut.webm',{type:'video/webm',lastModified:Date.now()});
 }finally{video.pause();video.remove();URL.revokeObjectURL(url)}
}
$('#publishBtn').onclick=async()=>{if(!session||!selectedFile)return;const btn=$('#publishBtn');btn.disabled=true;btn.textContent=selectedFile.size>48*1024*1024?'Sıkıştırılıyor…':'Yükleniyor…';try{const uploadFile=await compressVideoIfNeeded(selectedFile);btn.textContent='Yükleniyor…';const ext=(uploadFile.name.split('.').pop()||'webm').toLowerCase();const path=`${session.user.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('reels').upload(path,uploadFile,{contentType:uploadFile.type||'video/webm',upsert:false});if(up.error)throw up.error;const video_url=sb.storage.from('reels').getPublicUrl(path).data.publicUrl;const caption=$('#caption').value.trim();const ins=await sb.from('reels').insert({user_id:session.user.id,video_url,storage_path:path,caption,sound_title:'Orijinal Ses',status:'published'});if(ins.error)throw ins.error;selectedFile=null;$('#file').value='';$('#caption').value='';$('#composer').classList.remove('on');alert('Reel yayınlandı ☁️');await loadAll();}catch(e){console.error(e);const msg=(e.message||'').toLowerCase();if(msg.includes('maximum allowed size')||msg.includes('exceeded'))alert('Video yükleme sınırını aşıyor. Otomatik sıkıştırma tamamlanamadı.');else alert('Reel yüklenemedi: '+(e.message||'Bilinmeyen hata'));}finally{btn.disabled=false;btn.textContent='Yayınla'}};
async function toggleLike(id){if(!session){alert('Beğenmek için giriş yapın.');location.href='index.html#login';return}const exists=likes.some(x=>x.reel_id===id&&x.user_id===session.user.id);const q=exists?sb.from('reel_likes').delete().eq('reel_id',id).eq('user_id',session.user.id):sb.from('reel_likes').insert({reel_id:id,user_id:session.user.id});const r=await q;if(r.error){alert('Beğeni kaydedilemedi.');return}await loadAll();}
async function shareReel(id){const url=location.origin+'/reels.html#'+id;try{if(navigator.share)await navigator.share({title:'BULUT Reels',url});else{await navigator.clipboard.writeText(url);alert('Reel bağlantısı kopyalandı.')}}catch(e){}}
init();
</script>
</body></html>
