function setupReelAutoplay(){if(reelObserver)reelObserver.disconnect();const videos=[...document.querySelectorAll('.reel video')];const stopOthers=active=>videos.forEach(v=>{if(v!==active&&!v.paused)v.pause()});reelObserver=new IntersectionObserver(entries=>{entries.forEach(e=>{const v=e.target.querySelector('video');if(!v)return;if(e.isIntersecting&&e.intersectionRatio>=.62){stopOthers(v);v.play().catch(()=>{});}else if(!v.paused)v.pause();});},{threshold:[0,.25,.5,.62,.75,1]});document.querySelectorAll('.reel').forEach(el=>reelObserver.observe(el));videos.forEach(v=>{v.addEventListener('play',()=>stopOthers(v));});document.addEventListener('visibilitychange',()=>{if(document.hidden)videos.forEach(v=>v.pause())},{once:true});}

async function compressVideoIfNeeded(file){const limit=48*1048576;if(file.size<=limit)return file;const chosen=$('#chosen');chosen.textContent='Video boyutu kalite korunarak sıkıştırılıyor…';if(typeof MediaRecorder==='undefined')throw new Error('Bu tarayıcı otomatik video sıkıştırmayı desteklemiyor.');const url=URL.createObjectURL(file),video=document.createElement('video');video.src=url;video.preload='metadata';video.playsInline=true;video.muted=true;video.style.cssText='position:fixed;left:-99999px;top:-99999px;width:1px;height:1px;opacity:0';document.body.appendChild(video);try{await new Promise((ok,no)=>{video.onloadedmetadata=ok;video.onerror=()=>no(new Error('Video okunamadı'))});const duration=Number(video.duration);if(!Number.isFinite(duration)||duration<=0)throw new Error('Video süresi okunamadı');const scale=Math.min(1,1080/video.videoWidth,1920/video.videoHeight),w=Math.max(2,Math.floor(video.videoWidth*scale/2)*2),h=Math.max(2,Math.floor(video.videoHeight*scale/2)*2),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d',{alpha:false}),out=canvas.captureStream(30),source=video.captureStream?video.captureStream():null;if(source)source.getAudioTracks().forEach(t=>out.addTrack(t));const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',audioRate=128000;let videoRate=Math.floor((46*1048576*8/duration)-audioRate);videoRate=Math.max(750000,Math.min(8000000,videoRate));const opts={videoBitsPerSecond:videoRate,audioBitsPerSecond:audioRate};if(mime)opts.mimeType=mime;const rec=new MediaRecorder(out,opts),chunks=[];rec.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};const stopped=new Promise((ok,no)=>{rec.onstop=ok;rec.onerror=e=>no(e.error||new Error('Sıkıştırma başarısız'))});const draw=()=>{if(video.readyState>=2)ctx.drawImage(video,0,0,w,h);chosen.textContent='Video boyutu kalite korunarak sıkıştırılıyor… %'+Math.min(99,Math.floor async function toggleLike(id){if(!session){alert('Beğenmek için giriş yapın.');return}const exists=likes.some(x=>x.reel_id===id&&x.user_id===session.user.id),q=exists?sb.from('reel_likes').delete().eq('reel_id',id).eq('user_id',session.user.id):sb.from('reel_likes').insert({reel_id:id,user_id:session.user.id}),r=await q;if(!r.error)await loadAll()}
async function commentReel(id){if(!session){alert('Yorum yapmak için giriş yapın.');return}const body=prompt('Reel için yorumunuzu yazın:');if(body===null)return;const text=body.trim();if(!text)return;if(text.length>500){alert('Yorum en fazla 500 karakter olabilir.');return}const r=await sb.from('reel_comments').insert({reel_id:id,user_id:session.user.id,body:text});if(r.error){alert('Yorum kaydedilemedi: '+r.error.message);return}await loadAll();}
async function shareReel(id){const url=location.origin+'/reels.html#'+id;try{if(session)await sb.from('reel_shares').insert({reel_id:id,user_id:session.user.id});if(navigator.share)await navigator.share({title:'BULUT Reels',url});else{await navigator.clipboard.writeText(url);alert('Reel bağlantısı kopyalandı.')}}catch(e){}}
init();
</script></body></html>
