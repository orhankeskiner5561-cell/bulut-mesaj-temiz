name: Fix Reels Camera Direct
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make camera open directly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reels.html')
          s=p.read_text()
          s=s.replace('<input id="cameraFile" type="file" accept="image/*,video/*" capture="environment" hidden>','<input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>',1)
          s=s.replace("$('#cameraBtn').onclick=()=>{if(requireSession())$('#cameraFile').click()};","$('#cameraBtn').onclick=()=>{if(!requireSession())return;const cam=$('#cameraFile');cam.value='';cam.click()};",1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "bulut-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels.html
          git commit -m "Open phone camera directly from Reels camera button"
          git push
