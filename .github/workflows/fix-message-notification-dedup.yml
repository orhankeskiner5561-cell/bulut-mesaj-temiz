name: BULUT mesaj bildirim duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-message-notification-dedup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Duzeltmeyi uygula
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py
      - name: Kaydet
        shell: bash
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Mesaj tekrarlarini ve gecmis bildirimleri temizle"
            git push
          fi
