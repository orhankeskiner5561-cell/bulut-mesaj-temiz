name: Force Vercel Redeploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-vercel-redeploy.yml'
permissions:
  contents: write
jobs:
  trigger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger latest source commit
        run: |
          git config user.name "bulut-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "Force production redeploy with latest Bulut changes"
          git push
