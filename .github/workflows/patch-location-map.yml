name: Patch BULUT location map
on:
  push:
    paths:
      - '.github/workflows/patch-location-map.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch location sharing
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bulut-modern-ui.js')
          s=p.read_text()
          marker='  setupPostMediaPicker();\n\n  new MutationObserver'
          block=r'''  setupPostMediaPicker();

  // Gönderi konumu: telefon GPS konumunu al ve Google Maps bağlantısı oluştur.
  const setupPostLocation=()=>{
    const btn=document.getElementById('locb');
    const input=document.getElementById('pl');
    if(!btn||!input||btn.dataset.locationReady==='1')return;
    btn.dataset.locationReady='1';
    btn.textContent='📍 Mevcut Konum';
    btn.onclick=()=>{
      if(!navigator.geolocation){
        input.hidden=false;
        if(typeof toast==='function')toast('Bu cihaz konum paylaşımını desteklemiyor.');
        return;
      }
      btn.disabled=true;
      btn.textContent='📍 Konum alınıyor…';
      navigator.geolocation.getCurrentPosition(pos=>{
        const lat=Number(pos.coords.latitude).toFixed(6);
        const lng=Number(pos.coords.longitude).toFixed(6);
        const url=`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
        input.hidden=false;
        input.readOnly=true;
        input.value=`📍 Mevcut Konum|${url}`;
        btn.disabled=false;
        btn.textContent='✅ Konum Eklendi';
        if(typeof toast==='function')toast('Mevcut konum gönderiye eklendi.');
      },err=>{
        console.error('BULUT geolocation',err);
        input.hidden=false;
        input.readOnly=false;
        input.value='';
        btn.disabled=false;
        btn.textContent='📍 Mevcut Konum';
        if(typeof toast==='function')toast(err.code===1?'Konum izni verilmedi. Telefon ayarlarından izin verebilirsiniz.':'Konum alınamadı. GPS açık mı kontrol edin.');
      },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
    };
  };
  setupPostLocation();

  // Konumlu gönderilerde düz yazı yerine haritada açılan bağlantı göster.
  if(typeof window.postHtml==='function'&&!window.postHtml.__bulutMapWrapped){
    const originalPostHtml=window.postHtml;
    const wrappedPostHtml=function(p){
      let html=originalPostHtml(p);
      const loc=String(p?.location||'');
      if(loc.startsWith('📍 Mevcut Konum|')){
        const url=loc.slice(loc.indexOf('|')+1);
        const safeLoc=typeof esc==='function'?esc(loc):loc;
        const safeUrl=/^https:\/\/www\.google\.com\/maps\/search\/\?api=1&query=-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?$/.test(url)?url:'';
        if(safeUrl){
          html=html.replace(' · '+safeLoc,` · <a href="${safeUrl}" target="_blank" rel="noopener" style="color:#2d8cff;font-weight:800;text-decoration:none">📍 Haritada Aç</a>`);
        }
      }
      return html;
    };
    wrappedPostHtml.__bulutMapWrapped=true;
    window.postHtml=wrappedPostHtml;
  }

  new MutationObserver'''
          if 'const setupPostLocation=' not in s:
              s=s.replace(marker,block)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "bulut-location-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bulut-modern-ui.js
          git diff --cached --quiet && exit 0
          git commit -m "Connect post location to phone GPS and maps"
          git push
# trigger 2
