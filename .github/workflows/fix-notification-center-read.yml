name: BULUT bildirim merkezi duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-notification-center-read.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Duzeltmeyi uygula
        run: python3 .github/scripts/fix_notification_center.py
      - name: Kaydet
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Bildirim merkezinde mesaj ve takip ozetini ayir"
            git push
          fi
