name: Install Bulut User Counter
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Connect counter to all main pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['index.html','reels.html']:
              p=Path(name)
              s=p.read_text()
              tag='<script src="./bulut-user-counter.js"></script>'
              if tag in s: continue
              if '</body>' not in s: raise SystemExit(f'no body in {name}')
              s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "bulut-counter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html reels.html
          git commit -m "Show live Bulut user counter across site"
          git push
