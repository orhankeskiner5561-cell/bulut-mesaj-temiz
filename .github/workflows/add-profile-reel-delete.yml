name: Add profile reel delete
on:
  push:
    paths:
      - '.github/workflows/add-profile-reel-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="bulut-profile-reel-delete"'
          if marker in s:
              raise SystemExit(0)
          script = r'''
<script id="bulut-profile-reel-delete">
(() => {
  const escSel = (v) => String(v || '').replace(/[^a-zA-Z0-9_-]/g,'');
  async function getSessionUser(){
    try{ const r = await sb.auth.getSession(); return r.data.session?.user || null; }catch(e){ return null; }
  }
  function getReelId(card){
    const direct = card.dataset.reelId || card.dataset.id;
    if(direct) return direct;
    const a = card.querySelector('a[href*="reels.html#"]');
    if(!a) return '';
    const m = a.getAttribute('href').match(/reels\.html#([0-9a-f-]{20,})/i);
    return m ? m[1] : '';
  }
  async function addDeleteButtons(){
    const profile = document.querySelector('#profile');
    if(!profile || !profile.classList.contains('on')) return;
    const user = await getSessionUser();
    if(!user) return;
    const cards = [...profile.querySelectorAll('.reelFeedCard')];
    for(const card of cards){
      if(card.querySelector('.ownerReelDelete')) continue;
      const id = getReelId(card);
      if(!id) continue;
      const {data:r,error} = await sb.from('reels').select('id,user_id,storage_path').eq('id',id).maybeSingle();
      if(error || !r || r.user_id !== user.id) continue;
      const btn = document.createElement('button');
      btn.type='button';
      btn.className='danger ownerReelDelete';
      btn.style.cssText='width:100%;margin-top:10px';
      btn.textContent='🗑️ Reel’i Sil';
      btn.onclick = async () => {
        if(!confirm('Bu Reel kalıcı olarak silinsin mi?')) return;
        btn.disabled=true; btn.textContent='Siliniyor…';
        try{
          await sb.from('reel_comments').delete().eq('reel_id',id);
          await sb.from('reel_likes').delete().eq('reel_id',id);
          const del = await sb.from('reels').delete().eq('id',id).eq('user_id',user.id);
          if(del.error) throw del.error;
          if(r.storage_path) await sb.storage.from('reels').remove([r.storage_path]);
          card.remove();
          if(typeof toast==='function') toast('Reel silindi.'); else alert('Reel silindi.');
        }catch(e){
          console.error(e);
          alert('Reel silinemedi: '+(e.message||'Bilinmeyen hata'));
          btn.disabled=false; btn.textContent='🗑️ Reel’i Sil';
        }
      };
      card.appendChild(btn);
    }
  }
  const obs = new MutationObserver(() => { clearTimeout(window.__bulutDelT); window.__bulutDelT=setTimeout(addDeleteButtons,120); });
  obs.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
  document.addEventListener('click',()=>setTimeout(addDeleteButtons,150));
  setTimeout(addDeleteButtons,500);
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('index.html içinde </body> bulunamadı')
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add owner-only Reel delete button on profile"
          git push
