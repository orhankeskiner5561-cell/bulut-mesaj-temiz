name: BULUT profil Reel silme duzeltme
on:
  push:
    paths:
      - '.github/workflows/fix-brand-reference.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Profilde cift Reel sil butonunu temizle
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''
          /* BULUT REEL DELETE DEDUPE V1 */
          .reelFeedCard .ownerReelDelete + .ownerReelDelete{display:none!important}
          /* /BULUT REEL DELETE DEDUPE V1 */
          '''
          s = re.sub(r'/\* BULUT REEL DELETE DEDUPE V1 \*/.*?/\* /BULUT REEL DELETE DEDUPE V1 \*/', '', s, flags=re.S)
          s = s.replace('</style>', css + '\n</style>', 1)

          js = '''
          <script id="bulut-reel-delete-dedupe">
          (function(){
            function cleanDuplicateReelDeleteButtons(){
              document.querySelectorAll('.reelFeedCard').forEach(card=>{
                const buttons=[...card.querySelectorAll('.ownerReelDelete')];
                buttons.slice(1).forEach(b=>b.remove());
              });
            }
            const run=()=>requestAnimationFrame(cleanDuplicateReelDeleteButtons);
            document.addEventListener('DOMContentLoaded',run);
            const mo=new MutationObserver(run);
            mo.observe(document.documentElement,{subtree:true,childList:true});
            window.addEventListener('hashchange',run);
          })();
          </script>
          '''
          s = re.sub(r'<script id="bulut-reel-delete-dedupe">.*?</script>\s*', '', s, flags=re.S)
          s = s.replace('</body>', js + '\n</body>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Kaydet
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Profilde cift Reel sil butonunu kaldir"
            git push
          fi
