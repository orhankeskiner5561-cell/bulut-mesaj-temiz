name: BULUT referans marka duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-brand-reference.yml'

permissions:
  contents: write

jobs:
  apply-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Referans marka stilini uygula
        shell: python
        run: |
          from pathlib import Path
          import re

          css = r'''
          /* BULUT REFERANS MARKA V2 */
          .top{height:76px!important;padding:8px 16px!important;background:#fff!important;border-bottom:1px solid #dfeaf6!important}
          .brand{display:flex!important;align-items:center!important;gap:7px!important;white-space:nowrap!important;min-width:0!important}
          .cloudLogo{position:relative!important;width:70px!important;height:50px!important;display:inline-block!important;flex:0 0 70px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;animation:bulutFloat 2.8s ease-in-out infinite!important;overflow:visible!important}
          .cloudLogo .cloudShape{position:absolute!important;left:8px!important;bottom:5px!important;width:54px!important;height:27px!important;border:4px solid #20bfd0!important;border-radius:28px!important;background:linear-gradient(180deg,#fff 0%,#edfaff 66%,#cdeff7 100%)!important;box-shadow:0 4px 9px rgba(32,191,208,.18)!important;font-size:0!important;line-height:0!important;filter:none!important;transform:none!important}
          .cloudLogo .cloudShape:before{content:''!important;position:absolute!important;width:27px!important;height:27px!important;left:4px!important;top:-18px!important;border:4px solid #20bfd0!important;border-bottom:0!important;border-radius:50% 50% 0 0!important;background:#f9feff!important;transform:rotate(-4deg)!important}
          .cloudLogo .cloudShape:after{content:''!important;position:absolute!important;width:34px!important;height:34px!important;right:2px!important;top:-25px!important;border:4px solid #20bfd0!important;border-bottom:0!important;border-left-color:transparent!important;border-radius:50% 50% 0 0!important;background:#f9feff!important;transform:rotate(5deg)!important}
          .cloudFace{position:absolute!important;inset:0!important;font-size:0!important;animation:none!important;transform:none!important;z-index:4!important}
          .cloudFace .eye,.cloudFace .cheek,.cloudFace .mouth{position:absolute!important;display:block!important}
          .cloudFace .eye-open{left:27px!important;top:25px!important;width:7px!important;height:9px!important;background:#10233f!important;border-radius:50%!important;box-shadow:inset 2px 2px 0 rgba(255,255,255,.9)!important}
          .cloudFace .eye-wink{left:43px!important;top:25px!important;width:9px!important;height:5px!important;border-top:3px solid #10233f!important;border-radius:50%!important;transform:rotate(-8deg)!important}
          .cloudFace .cheek{top:34px!important;width:8px!important;height:4px!important;border-radius:50%!important;background:#ff9eae!important;opacity:.85!important}
          .cloudFace .cheek-l{left:20px!important}.cloudFace .cheek-r{left:49px!important}
          .cloudFace .mouth{left:34px!important;top:33px!important;width:12px!important;height:8px!important;background:#14233c!important;border-radius:3px 3px 9px 9px!important}
          .cloudFace .mouth:after{content:''!important;position:absolute!important;left:3px!important;bottom:1px!important;width:6px!important;height:3px!important;background:#ff665d!important;border-radius:50%!important}
          .brandName{font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif!important;font-size:29px!important;font-weight:1000!important;letter-spacing:.2px!important;color:#19aebe!important;background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;text-shadow:0 1px 0 rgba(0,0,0,.03)!important;line-height:1!important}
          .brandTr{font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif!important;color:#e30a17!important;font-size:25px!important;font-weight:1000!important;line-height:1!important;margin-left:1px!important;letter-spacing:-1px!important}
          .brandFlag{font-size:25px!important;line-height:1!important;margin-left:-2px!important}
          @keyframes bulutFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
          @media(max-width:420px){
            .top{height:72px!important;padding:7px 12px!important}
            .brand{gap:5px!important}
            .cloudLogo{width:62px!important;height:46px!important;flex-basis:62px!important;transform-origin:center!important}
            .cloudLogo .cloudShape{left:5px!important;transform:scale(.91)!important;transform-origin:left bottom!important}
            .cloudFace{transform:scale(.91)!important;transform-origin:left bottom!important}
            .brandName{font-size:27px!important}.brandTr{font-size:23px!important}.brandFlag{font-size:23px!important}
          }
          @media(max-width:370px){.cloudLogo{width:56px!important;flex-basis:56px!important}.brandName{font-size:24px!important}.brandTr{font-size:21px!important}.brandFlag{font-size:21px!important}}
          @media(prefers-reduced-motion:reduce){.cloudLogo{animation:none!important}}
          /* /BULUT REFERANS MARKA V2 */
          '''

          face = '<span class="cloudFace" aria-hidden="true"><i class="eye eye-open"></i><i class="eye eye-wink"></i><i class="cheek cheek-l"></i><i class="cheek cheek-r"></i><i class="mouth"></i></span>'

          for name in ('index.html','reels.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<span class="cloudFace">😊</span>', face)
              s=re.sub(r'\n?\s*/\* BULUT REFERANS MARKA V2 \*/.*?/\* /BULUT REFERANS MARKA V2 \*/\s*', '\n', s, flags=re.S)
              if '</style>' not in s:
                  raise SystemExit(f'{name}: style etiketi bulunamadi')
              s=s.replace('</style>', css+'\n</style>', 1)
              p.write_text(s,encoding='utf-8')
      - name: Degisiklikleri kaydet
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html reels.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "BULUT logosunu referans tasarima esitle"
            git push
          fi
