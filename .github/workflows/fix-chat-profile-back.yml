name: BULUT sohbet profil geri duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-chat-profile-back.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Duzeltmeyi uygula
        run: python3 .github/scripts/fix_chat_profile_back.py
      - name: Kaydet
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Mesaj bildirim profil ve geri davranisini duzelt"
            git push
          fi
