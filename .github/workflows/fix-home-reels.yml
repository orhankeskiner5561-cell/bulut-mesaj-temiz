name: Ana Akış Reels Etkileşimleri

on:
  push:
    paths:
      - '.github/workflows/fix-home-reels.yml'

permissions:
  contents: write

jobs:
  patch-home-reels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ana akış Reels kartını tamamla
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '.reelMedia{width:100%;max-height:620px;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:#172331;display:block}',
            '.reelMedia{width:100%;max-height:520px;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:#172331;display:block}.reelFeedCard{padding:14px}.reelFeedCard .head{margin-bottom:6px}.reelFeedCard>p{margin:9px 0}.reelFeedCard .pa button{flex:1;padding:10px 6px}.reelOpen{display:block;text-align:center;margin-top:9px;color:var(--b);font-size:12px;font-weight:800;text-decoration:none}'
          )

          s = s.replace(
            'let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],reels=[],reelLikes=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null;',
            'let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],reels=[],reelLikes=[],reelComments=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),openReelComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null;'
          )

          old_load = "async function loadFeedData(){const [p,l,c,r,rl]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('likes').select('post_id,user_id'),sb.from('comments').select('id,post_id,user_id,body,created_at').order('created_at',{ascending:true}),sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(100),sb.from('reel_likes').select('reel_id,user_id')]);if(p.error)console.error(p.error);if(l.error)console.error(l.error);if(c.error)console.error(c.error);if(r.error)console.error(r.error);if(rl.error)console.error(rl.error);posts=p.data||[];likes=l.data||[];comments=c.data||[];reels=r.data||[];reelLikes=rl.data||[]}"
          new_load = "async function loadFeedData(){const [p,l,c,r,rl,rc]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('likes').select('post_id,user_id'),sb.from('comments').select('id,post_id,user_id,body,created_at').order('created_at',{ascending:true}),sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(100),sb.from('reel_likes').select('reel_id,user_id'),sb.from('reel_comments').select('id,reel_id,user_id,body,created_at').order('created_at',{ascending:true})]);if(p.error)console.error(p.error);if(l.error)console.error(l.error);if(c.error)console.error(c.error);if(r.error)console.error(r.error);if(rl.error)console.error(rl.error);if(rc.error)console.error(rc.error);posts=p.data||[];likes=l.data||[];comments=c.data||[];reels=r.data||[];reelLikes=rl.data||[];reelComments=rc.data||[]}"
          if old_load not in s:
            raise SystemExit('Mevcut loadFeedData bulunamadı')
          s = s.replace(old_load, new_load)

          old_reel = "function reelFeedHtml(r){const u=profilesMap[r.user_id]||{full_name:'Bulut Kullanıcısı',username:'bulut'},count=reelLikes.filter(x=>x.reel_id===r.id).length,liked=!!(session&&reelLikes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id));return `<article class=\"card post reelFeedCard\" data-reel=\"${r.id}\"><div class=\"head\"><div class=\"av\">${avatarHtml(u)}</div><div><h3>${esc(u.full_name)}</h3><small>@${esc(u.username)} · Reels</small></div></div><p><span class=\"reelBadge\">🎬 Reel</span><br>${esc(r.caption||'BULUT Reels ☁️')}</p><video class=\"reelMedia\" src=\"${esc(r.video_url)}\" controls playsinline preload=\"metadata\"></video><div class=\"stats\"><span>❤️ ${count}</span><span>🎬 Reels</span><span>↗ Paylaş</span></div><div class=\"pa\"><button data-reel-like=\"${r.id}\" class=\"${liked?'liked':''}\">${liked?'♥ Beğendin':'♡ Beğen'}</button><button onclick=\"location.href='reels.html#${r.id}'\">🎬 Reels'te Aç</button><button data-reel-share=\"${r.id}\">↗ Paylaş</button></div></article>`}"
          new_reel = "function reelFeedHtml(r){const u=profilesMap[r.user_id]||{full_name:'Bulut Kullanıcısı',username:'bulut'},count=reelLikes.filter(x=>x.reel_id===r.id).length,cc=reelComments.filter(x=>x.reel_id===r.id).length,liked=!!(session&&reelLikes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id)),isOpen=openReelComments.has(r.id);return `<article class=\"card post reelFeedCard\" data-reel=\"${r.id}\"><div class=\"head\"><div class=\"av\">${avatarHtml(u)}</div><div><h3>${esc(u.full_name)}</h3><small>@${esc(u.username)} · Reels</small></div></div><p><span class=\"reelBadge\">🎬 Reel</span><br>${esc(r.caption||'BULUT Reels ☁️')}</p><video class=\"reelMedia\" src=\"${esc(r.video_url)}\" controls playsinline preload=\"metadata\"></video><div class=\"stats\"><span>❤️ ${count}</span><span>💬 ${cc}</span><span>↗ Paylaş</span></div><div class=\"pa\"><button data-reel-like=\"${r.id}\" class=\"${liked?'liked':''}\">${liked?'♥ Beğendin':'♡ Beğen'}</button><button data-reel-comment=\"${r.id}\">💬 Yorum</button><button data-reel-share=\"${r.id}\">↗ Paylaş</button></div><div class=\"comments\" id=\"reel-comments-${r.id}\">${isOpen?reelCommentsHtml(r.id):''}</div><a class=\"reelOpen\" href=\"reels.html#${r.id}\">🎬 Reels'te tam ekran aç</a></article>`}"
          if old_reel not in s:
            raise SystemExit('Mevcut reelFeedHtml bulunamadı')
          s = s.replace(old_reel, new_reel)

          anchor = "function commentsHtml(pid){"
          reel_comments_fn = "function reelCommentsHtml(rid){const list=reelComments.filter(c=>c.reel_id===rid);return `${list.map(c=>{const u=profilesMap[c.user_id]||{full_name:'Üye'};return `<div class=\"commentItem\"><b>${esc(u.full_name)}</b> ${esc(c.body)}</div>`}).join('')}${session?`<div class=\"commentComposer\"><input id=\"rci-${rid}\" maxlength=\"500\" placeholder=\"Reel'e yorum yaz...\"><button data-send-reel-comment=\"${rid}\">Gönder</button></div>`:'<p class=\"tiny\">Yorum yapmak için giriş yapın.</p>'}`}\n"
          if 'function reelCommentsHtml(rid)' not in s:
            if anchor not in s:
              raise SystemExit('commentsHtml bağlantı noktası bulunamadı')
            s = s.replace(anchor, reel_comments_fn + anchor)

          old_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment));$$('[data-reel-like]').forEach(b=>b.onclick=()=>toggleReelLike(b.dataset.reelLike));$$('[data-reel-share]').forEach(b=>b.onclick=()=>shareReelFromFeed(b.dataset.reelShare))}"
          new_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment));$$('[data-reel-like]').forEach(b=>b.onclick=()=>toggleReelLike(b.dataset.reelLike));$$('[data-reel-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.reelComment;openReelComments.has(id)?openReelComments.delete(id):openReelComments.add(id);renderFeed()});$$('[data-send-reel-comment]').forEach(b=>b.onclick=()=>sendReelComment(b.dataset.sendReelComment));$$('[data-reel-share]').forEach(b=>b.onclick=()=>shareReelFromFeed(b.dataset.reelShare))}"
          if old_bind not in s:
            raise SystemExit('Mevcut bindPostActions bulunamadı')
          s = s.replace(old_bind, new_bind)

          share_anchor = "async function shareReelFromFeed(id){"
          send_fn = "async function sendReelComment(id){if(!session)return requireLogin('Reel yorumlamak için giriş yapmalısınız.');const inp=$('#rci-'+id),body=inp?.value.trim();if(!body)return;const {error}=await sb.from('reel_comments').insert({reel_id:id,user_id:session.user.id,body});if(error)return toast('Reel yorumu gönderilemedi.');openReelComments.add(id);await refreshAll();toast('Reel yorumunuz eklendi.')}\n"
          if 'async function sendReelComment(id)' not in s:
            if share_anchor not in s:
              raise SystemExit('shareReelFromFeed bağlantı noktası bulunamadı')
            s = s.replace(share_anchor, send_fn + share_anchor)

          p.write_text(s, encoding='utf-8')

      - name: Değişikliği kaydet
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Ana akış Reels beğeni yorum paylaşımını tamamla"
          git push
