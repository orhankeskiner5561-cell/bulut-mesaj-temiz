name: Reels Yukleme Siniri Duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-home-reels.yml'

permissions:
  contents: write

jobs:
  patch-reels-upload-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reels yukleme boyut kontrolunu Supabase siniriyla esitle
        shell: python
        run: |
          from pathlib import Path
          p = Path('reels.html')
          s = p.read_text(encoding='utf-8')

          old_pick = "$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>125829120){alert('Video en fazla 120 MB olabilir.');e.target.value='';return}selectedFile=f;$('#chosen').textContent='Seçildi: '+f.name;$('#composer').classList.add('on');};"
          new_pick = "$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const max=50*1024*1024;if(f.size>max){alert('Bu video '+(f.size/1024/1024).toFixed(1)+' MB. Mevcut Supabase paketinde Reel en fazla 50 MB olabilir. Daha küçük bir video seçin veya videoyu sıkıştırın.');e.target.value='';selectedFile=null;$('#composer').classList.remove('on');return}selectedFile=f;$('#chosen').textContent='Seçildi: '+f.name+' · '+(f.size/1024/1024).toFixed(1)+' MB';$('#composer').classList.add('on');};"
          if old_pick in s:
            s = s.replace(old_pick, new_pick)
          elif new_pick not in s:
            raise SystemExit('Dosya secim kodu bulunamadi')

          old_catch = "}catch(e){console.error(e);alert('Reel yüklenemedi: '+(e.message||'Bilinmeyen hata'));}finally{btn.disabled=false;btn.textContent='Yayınla'}};"
          new_catch = "}catch(e){console.error(e);const msg=(e.message||'').toLowerCase();if(msg.includes('maximum allowed size')||msg.includes('exceeded'))alert('Video Supabase yükleme sınırını aşıyor. Mevcut sınır 50 MB. Videoyu küçültüp tekrar deneyin.');else alert('Reel yüklenemedi: '+(e.message||'Bilinmeyen hata'));}finally{btn.disabled=false;btn.textContent='Yayınla'}};"
          if old_catch in s:
            s = s.replace(old_catch, new_catch)
          elif new_catch not in s:
            raise SystemExit('Yukleme hata kodu bulunamadi')

          p.write_text(s, encoding='utf-8')

      - name: Degisikligi kaydet
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "Reels yukleme boyut sinirini duzelt"
          git push
