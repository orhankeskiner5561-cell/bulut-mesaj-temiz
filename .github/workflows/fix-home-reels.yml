name: Ana Akış Reels Düzeltmesi

on:
  push:
    paths:
      - '.github/workflows/fix-home-reels.yml'

permissions:
  contents: write

jobs:
  patch-home-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ana akış kodunu düzelt
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
            '.media{width:100%;max-height:560px;object-fit:cover;border-radius:18px}',
            '.media{width:100%;max-height:560px;object-fit:cover;border-radius:18px}.reelMedia{width:100%;max-height:620px;aspect-ratio:9/16;object-fit:cover;border-radius:18px;background:#172331;display:block}.reelBadge{display:inline-block;margin:2px 0 8px;padding:5px 9px;border-radius:999px;background:#eef7ff;color:#2d8cff;font-size:12px;font-weight:800}'
          )

          s = s.replace(
            '<button onclick="location.href=\'reels.html\'"<span>🎬</span>Reels</button>',
            '<button onclick="location.href=\'reels.html\'"><span>🎬</span>Reels</button>'
          )

          s = s.replace(
            'let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null;',
            'let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],reels=[],reelLikes=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null;'
          )

          old_load = "async function loadFeedData(){const [p,l,c]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('likes').select('post_id,user_id'),sb.from('comments').select('id,post_id,user_id,body,created_at').order('created_at',{ascending:true})]);if(p.error)console.error(p.error);if(l.error)console.error(l.error);if(c.error)console.error(c.error);posts=p.data||[];likes=l.data||[];comments=c.data||[]}"
          new_load = "async function loadFeedData(){const [p,l,c,r,rl]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(100),sb.from('likes').select('post_id,user_id'),sb.from('comments').select('id,post_id,user_id,body,created_at').order('created_at',{ascending:true}),sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(100),sb.from('reel_likes').select('reel_id,user_id')]);if(p.error)console.error(p.error);if(l.error)console.error(l.error);if(c.error)console.error(c.error);if(r.error)console.error(r.error);if(rl.error)console.error(rl.error);posts=p.data||[];likes=l.data||[];comments=c.data||[];reels=r.data||[];reelLikes=rl.data||[]}"
          if old_load not in s:
            raise SystemExit('loadFeedData bulunamadı')
          s = s.replace(old_load, new_load)

          old_render = "function renderFeed(){const root=$('#feed');if(!posts.length){root.innerHTML='<div class=\"card empty\">Henüz gerçek gönderi yok. İlk paylaşımı siz yapın ☁️</div>';return}root.innerHTML=posts.map(p=>postHtml(p)).join('');bindPostActions()}"
          new_render = "function renderFeed(){const root=$('#feed');const normalPosts=posts.filter(p=>!/^Yeni Reel\\s*☁️?$/i.test((p.body||'').trim()));const items=[...normalPosts.map(p=>({...p,_kind:'post'})),...reels.map(r=>({...r,_kind:'reel'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));if(!items.length){root.innerHTML='<div class=\"card empty\">Henüz gerçek gönderi yok. İlk paylaşımı siz yapın ☁️</div>';return}root.innerHTML=items.map(x=>x._kind==='reel'?reelFeedHtml(x):postHtml(x)).join('');bindPostActions()}"
          if old_render not in s:
            raise SystemExit('renderFeed bulunamadı')
          s = s.replace(old_render, new_render)

          anchor = "function commentsHtml(pid){"
          reel_fn = "function reelFeedHtml(r){const u=profilesMap[r.user_id]||{full_name:'Bulut Kullanıcısı',username:'bulut'},count=reelLikes.filter(x=>x.reel_id===r.id).length,liked=!!(session&&reelLikes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id));return `<article class=\"card post reelFeedCard\" data-reel=\"${r.id}\"><div class=\"head\"><div class=\"av\">${avatarHtml(u)}</div><div><h3>${esc(u.full_name)}</h3><small>@${esc(u.username)} · Reels</small></div></div><p><span class=\"reelBadge\">🎬 Reel</span><br>${esc(r.caption||'BULUT Reels ☁️')}</p><video class=\"reelMedia\" src=\"${esc(r.video_url)}\" controls playsinline preload=\"metadata\"></video><div class=\"stats\"><span>❤️ ${count}</span><span>🎬 Reels</span><span>↗ Paylaş</span></div><div class=\"pa\"><button data-reel-like=\"${r.id}\" class=\"${liked?'liked':''}\">${liked?'♥ Beğendin':'♡ Beğen'}</button><button onclick=\"location.href='reels.html#${r.id}'\">🎬 Reels'te Aç</button><button data-reel-share=\"${r.id}\">↗ Paylaş</button></div></article>`}\n"
          if reel_fn.strip() not in s:
            if anchor not in s:
              raise SystemExit('commentsHtml bağlantı noktası bulunamadı')
            s = s.replace(anchor, reel_fn + anchor)

          old_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment))}"
          new_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment));$$('[data-reel-like]').forEach(b=>b.onclick=()=>toggleReelLike(b.dataset.reelLike));$$('[data-reel-share]').forEach(b=>b.onclick=()=>shareReelFromFeed(b.dataset.reelShare))}"
          if old_bind not in s:
            raise SystemExit('bindPostActions bulunamadı')
          s = s.replace(old_bind, new_bind)

          share_anchor = "function requireLogin(msg){toast(msg);route('login')}"
          reel_actions = "async function toggleReelLike(id){if(!session)return requireLogin('Reel beğenmek için giriş yapmalısınız.');const exists=reelLikes.some(x=>x.reel_id===id&&x.user_id===session.user.id);const q=exists?sb.from('reel_likes').delete().eq('reel_id',id).eq('user_id',session.user.id):sb.from('reel_likes').insert({reel_id:id,user_id:session.user.id});const {error}=await q;if(error)return toast('Reel beğenisi kaydedilemedi.');await refreshAll()}\nasync function shareReelFromFeed(id){const url=location.origin+'/reels.html#'+id;try{if(navigator.share)await navigator.share({title:'BULUT Reels',url});else{await navigator.clipboard.writeText(url);toast('Reel bağlantısı kopyalandı.')}}catch(e){if(e?.name!=='AbortError')toast('Paylaşım açılamadı.')}}\n"
          if 'async function toggleReelLike(id)' not in s:
            if share_anchor not in s:
              raise SystemExit('requireLogin bağlantı noktası bulunamadı')
            s = s.replace(share_anchor, reel_actions + share_anchor)

          p.write_text(s, encoding='utf-8')

      - name: Değişikliği kaydet
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Ana akışta Reels videolarını oynat"
          git push
