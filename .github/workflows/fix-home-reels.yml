name: Ana Akış Reels Otomatik Geçiş

on:
  push:
    paths:
      - '.github/workflows/fix-home-reels.yml'

permissions:
  contents: write

jobs:
  patch-home-reels-autoplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Görünen Reeli oynat ve geçileni durdur
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_state = "let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],reels=[],reelLikes=[],reelComments=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),openReelComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null;"
          new_state = "let session=null,currentProfile=null,profilesMap={},posts=[],likes=[],comments=[],reels=[],reelLikes=[],reelComments=[],viewedProfileId=null,selectedPhoto=null,openComments=new Set(),openReelComments=new Set(),notifChannel=null,msgChannel=null,currentChat=null,reelObserver=null;"
          if old_state in s:
            s = s.replace(old_state, new_state)
          elif new_state not in s:
            raise SystemExit('Global durum satırı bulunamadı')

          old_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment));$$('[data-reel-like]').forEach(b=>b.onclick=()=>toggleReelLike(b.dataset.reelLike));$$('[data-reel-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.reelComment;openReelComments.has(id)?openReelComments.delete(id):openReelComments.add(id);renderFeed()});$$('[data-send-reel-comment]').forEach(b=>b.onclick=()=>sendReelComment(b.dataset.sendReelComment));$$('[data-reel-share]').forEach(b=>b.onclick=()=>shareReelFromFeed(b.dataset.reelShare))}"
          new_bind = "function bindPostActions(){$$('[data-like]').forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$$('[data-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.comment;openComments.has(id)?openComments.delete(id):openComments.add(id);renderFeed()});$$('[data-share]').forEach(b=>b.onclick=()=>sharePost(b.dataset.share));$$('[data-send-comment]').forEach(b=>b.onclick=()=>sendComment(b.dataset.sendComment));$$('[data-reel-like]').forEach(b=>b.onclick=()=>toggleReelLike(b.dataset.reelLike));$$('[data-reel-comment]').forEach(b=>b.onclick=()=>{const id=b.dataset.reelComment;openReelComments.has(id)?openReelComments.delete(id):openReelComments.add(id);renderFeed()});$$('[data-send-reel-comment]').forEach(b=>b.onclick=()=>sendReelComment(b.dataset.sendReelComment));$$('[data-reel-share]').forEach(b=>b.onclick=()=>shareReelFromFeed(b.dataset.reelShare));setupReelAutoplay()}"
          if old_bind in s:
            s = s.replace(old_bind, new_bind)
          elif new_bind not in s:
            raise SystemExit('bindPostActions bulunamadı')

          anchor = "async function toggleLike(pid){"
          autoplay_fn = "function setupReelAutoplay(){if(reelObserver){reelObserver.disconnect();reelObserver=null}const videos=$$('.reelFeedCard .reelMedia');if(!videos.length)return;const pauseOthers=active=>videos.forEach(v=>{if(v!==active&&!v.paused)v.pause()});reelObserver=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.62).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length){const v=visible[0].target;pauseOthers(v);if(v.paused){const attempt=v.play();if(attempt?.catch)attempt.catch(()=>{v.muted=true;v.play().catch(()=>{})})}}entries.forEach(e=>{if((!e.isIntersecting||e.intersectionRatio<0.35)&&!e.target.paused)e.target.pause()})},{threshold:[0,0.35,0.62,0.8,1]});videos.forEach(v=>{v.setAttribute('playsinline','');reelObserver.observe(v)});document.addEventListener('visibilitychange',()=>{if(document.hidden)videos.forEach(v=>v.pause())},{once:true})}\n"
          if 'function setupReelAutoplay(){' not in s:
            if anchor not in s:
              raise SystemExit('toggleLike bağlantı noktası bulunamadı')
            s = s.replace(anchor, autoplay_fn + anchor)

          p.write_text(s, encoding='utf-8')

      - name: Değişikliği kaydet
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git commit -m "Ana akışta görünen Reeli otomatik oynat"
          git push
