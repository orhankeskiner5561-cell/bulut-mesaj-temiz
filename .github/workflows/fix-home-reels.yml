name: BULUT Ortak Hareketli Logo

on:
  push:
    paths:
      - '.github/workflows/fix-home-reels.yml'

permissions:
  contents: write

jobs:
  patch-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tum sayfalara yeni BULUT basligini uygula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = r'''
          /* BULUT ortak hareketli marka */
          .brand{display:flex!important;align-items:center!important;gap:5px!important;font-weight:900!important}
          .cloudLogo{width:47px;height:39px;display:inline-grid;place-items:center;position:relative;border:3px solid #27c7d9;border-radius:20px;background:linear-gradient(145deg,#effdff,#c9f7ff);box-shadow:0 3px 10px rgba(39,199,217,.24);animation:bulutFloat 2.4s ease-in-out infinite;flex:0 0 auto}
          .cloudLogo .cloudShape{font-size:31px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));transform:translateY(-1px)}
          .cloudLogo .cloudFace{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%);font-size:13px;line-height:1;animation:bulutSmile 3.2s ease-in-out infinite}
          .brandName{font-size:23px;font-weight:950;letter-spacing:.2px;background:linear-gradient(90deg,#18bfcf,#2d8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
          .brandTr{color:#e30a17!important;font-size:21px!important;font-weight:950!important;line-height:1!important;margin-left:0!important}
          .brandFlag{font-size:20px!important;line-height:1!important;margin-left:0!important}
          @keyframes bulutFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
          @keyframes bulutSmile{0%,45%,100%{transform:translate(-50%,-50%) scale(1)}50%,58%{transform:translate(-50%,-50%) scale(1.12)}}
          @media(max-width:420px){.cloudLogo{width:43px;height:36px}.cloudLogo .cloudShape{font-size:28px}.cloudLogo .cloudFace{font-size:12px}.brandName{font-size:21px}.brandTr{font-size:19px!important}.brandFlag{font-size:18px!important}}
          @media(prefers-reduced-motion:reduce){.cloudLogo,.cloudLogo .cloudFace{animation:none}}
          '''
          brand = '<div class="brand"><span class="cloudLogo" aria-label="Gülen Bulut"><span class="cloudShape">☁️</span><span class="cloudFace">😊</span></span><span class="brandName">BULUT</span><span class="brandTr">TR</span><span class="brandFlag">🇹🇷</span></div>'

          for name in ('index.html','reels.html'):
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if '/* BULUT ortak hareketli marka */' not in s:
                  s=s.replace('</style>', css+'\n</style>', 1)
              s=re.sub(r'<div class="brand">.*?</div>', brand, s, count=1, flags=re.S)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Degisikligi kaydet
        shell: bash
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html reels.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gulen hareketli BULUT logosunu tum sayfalara uygula"
          git push
