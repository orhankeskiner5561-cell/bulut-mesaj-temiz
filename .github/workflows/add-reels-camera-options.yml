name: Add Reels Media Picker Options
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add camera photo video choices
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reels.html')
          s=p.read_text()
          s=s.replace('.upload:disabled{opacity:.6}', '.upload:disabled{opacity:.6}.mediaChoices{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}.mediaChoices.on{display:grid}.mediaChoice{border:1px solid #dfeaf6;background:#fff;border-radius:15px;padding:12px 8px;font-weight:850;color:#10233f;font-size:14px}.mediaChoice span{display:block;font-size:25px;margin-bottom:4px}@media(max-width:420px){.mediaChoice{padding:11px 5px;font-size:13px}}',1)
          s=s.replace('<main class="page"><div class="headrow"><h1>Reels / Keşfet</h1><button class="upload" id="pickBtn">＋ Fotoğraf / Reel</button></div>','<main class="page"><div class="headrow"><h1>Reels / Keşfet</h1><button class="upload" id="pickBtn">＋ Yükle</button></div><div class="mediaChoices" id="mediaChoices"><button type="button" class="mediaChoice" id="cameraBtn"><span>📷</span>Kamera</button><button type="button" class="mediaChoice" id="photoBtn"><span>🖼️</span>Fotoğraf</button><button type="button" class="mediaChoice" id="videoBtn"><span>🎥</span>Video</button></div>',1)
          s=s.replace('<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/*" hidden>','<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/*" hidden><input id="cameraFile" type="file" accept="image/*,video/*" capture="environment" hidden><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden><input id="videoFile" type="file" accept="video/*" hidden>',1)
          old="$('#autoMode').onclick=()=>setUploadMode('auto');$('#originalMode').onclick=()=>setUploadMode('original');$('#pickBtn').onclick=()=>{if(!session){alert('Fotoğraf veya Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return}$('#file').click()};$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;selectedFile=f;$('.modeBox').style.display=f.type.startsWith('image/')?'none':'';updateChosenText();$('#composer').classList.add('on')};$('#cancelBtn').onclick=()=>{selectedFile=null;$('#file').value='';$('#caption').value='';$('.modeBox').style.display='';setUploadMode('auto');$('#composer').classList.remove('on')};"
          new="$('#autoMode').onclick=()=>setUploadMode('auto');$('#originalMode').onclick=()=>setUploadMode('original');function requireSession(){if(session)return true;alert('Fotoğraf veya Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return false}function chooseFile(f,input){if(!f)return;selectedFile=f;document.querySelectorAll('#file,#cameraFile,#photoFile,#videoFile').forEach(x=>{if(x!==input)x.value=''});$('.modeBox').style.display=f.type.startsWith('image/')?'none':'';updateChosenText();$('#composer').classList.add('on');$('#mediaChoices').classList.remove('on')}function bindPicker(sel){$(sel).onchange=e=>chooseFile(e.target.files?.[0],e.target)}$('#pickBtn').onclick=()=>{if(!requireSession())return;$('#mediaChoices').classList.toggle('on')};$('#cameraBtn').onclick=()=>{if(requireSession())$('#cameraFile').click()};$('#photoBtn').onclick=()=>{if(requireSession())$('#photoFile').click()};$('#videoBtn').onclick=()=>{if(requireSession())$('#videoFile').click()};bindPicker('#file');bindPicker('#cameraFile');bindPicker('#photoFile');bindPicker('#videoFile');$('#cancelBtn').onclick=()=>{selectedFile=null;document.querySelectorAll('#file,#cameraFile,#photoFile,#videoFile').forEach(x=>x.value='');$('#caption').value='';$('.modeBox').style.display='';setUploadMode('auto');$('#composer').classList.remove('on');$('#mediaChoices').classList.remove('on')};"
          if old not in s: raise SystemExit('picker block not found')
          s=s.replace(old,new,1)
          s=s.replace("selectedFile=null;$('#file').value='';$('#caption').value='';$('.modeBox').style.display='';$('#composer').classList.remove('on');", "selectedFile=null;document.querySelectorAll('#file,#cameraFile,#photoFile,#videoFile').forEach(x=>x.value='');$('#caption').value='';$('.modeBox').style.display='';$('#composer').classList.remove('on');$('#mediaChoices').classList.remove('on');",1)
          p.write_text(s)
          PY
          git config user.name "bulut-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels.html
          git commit -m "Add camera photo and video choices to Reels upload"
          git push
