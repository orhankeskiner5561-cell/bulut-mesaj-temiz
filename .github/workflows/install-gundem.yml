name: Install Bulut Gundem
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Link agenda module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./bulut-gundem.js"></script>'
          if tag not in s:
              target='<script src="./bulut-stories.js"></script>'
              if target not in s: raise SystemExit('stories tag not found')
              s=s.replace(target,target+'\n'+tag,1)
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "bulut-gundem-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Connect live agenda to Bulut"
          git push
