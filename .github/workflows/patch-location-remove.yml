name: Patch removable post location
'on':
  push:
    branches:
      - main
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make selected location removable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='/* BULUT_REMOVABLE_LOCATION */'
          if marker not in s:
              inject='''<script>
/* BULUT_REMOVABLE_LOCATION */
document.addEventListener("click", function(e){
  const b=e.target.closest && e.target.closest("#locb");
  if(!b) return;
  const loc=document.getElementById("loc");
  const selected=(b.textContent||"").includes("Konum Eklendi") || (loc && (loc.value||"").includes("google.com/maps/"));
  if(!selected) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(loc) loc.value="";
  b.textContent="📍 Mevcut Konum";
  if(typeof toast==="function") toast("Konum kaldırıldı.");
}, true);
</script>'''
              s=s.replace('</body>',inject+'\n</body>')
              p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "bulut-location-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Allow removing selected post location"
          git push
