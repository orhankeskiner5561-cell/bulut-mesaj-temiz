name: Removable location installer
on: push
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); x="<script>/* BULUT_REMOVABLE_LOCATION */document.addEventListener(\"click\",function(e){const b=e.target.closest&&e.target.closest(\"#locb\");if(!b)return;const l=document.getElementById(\"loc\");const q=(b.textContent||\"\").includes(\"Konum Eklendi\")||(l&&(l.value||\"\").includes(\"google.com/maps/\"));if(!q)return;e.preventDefault();e.stopImmediatePropagation();if(l)l.value=\"\";b.textContent=\"📍 Mevcut Konum\";if(typeof toast===\"function\")toast(\"Konum kaldırıldı.\");},true);</script>"; p.write_text(s if "BULUT_REMOVABLE_LOCATION" in s else s.replace("</body>",x+"</body>"))'
          if git diff --quiet; then exit 0; fi
          git config user.name bulut-location-bot
          git config user.email actions@users.noreply.github.com
          git add index.html
          git commit -m "Allow removing selected post location"
          git push
