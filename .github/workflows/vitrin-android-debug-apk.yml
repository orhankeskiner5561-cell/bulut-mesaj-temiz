name: VITRIN Android WebView Fullscreen APK

on:
  push:
    branches:
      - vitrin-android-webview-tam-ekran-fix-2026-08-31
    paths:
      - 'android-app/**'
      - '.github/workflows/vitrin-android-debug-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add Android permissions and fullscreen mobile WebView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms='''<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'''
          if marker in s:
              s=s.replace(marker,perms,1)
          s=s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="portrait"', 1)
          p.write_text(s)

          mains=list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if not mains:
              raise SystemExit('MainActivity.java not found')
          m=mains[0]
          pkg=m.parent.as_posix().split('/java/',1)[1].replace('/','.')
          target='https://bulut-mesaj-temiz-git-v-fb8871-orhankeskiner5561-cells-projects.vercel.app'
          code=f'''package {pkg};\n\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.view.Window;\nimport android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {{\n  private static final String VITRIN_URL = "{target}";\n\n  @Override\n  public void onCreate(Bundle savedInstanceState) {{\n    super.onCreate(savedInstanceState);\n    Window w=getWindow();\n    w.setStatusBarColor(android.graphics.Color.BLACK);\n    w.setNavigationBarColor(android.graphics.Color.BLACK);\n    WebView web=getBridge().getWebView();\n    WebSettings st=web.getSettings();\n    st.setSupportZoom(false);\n    st.setBuiltInZoomControls(false);\n    st.setDisplayZoomControls(false);\n    st.setUseWideViewPort(false);\n    st.setLoadWithOverviewMode(false);\n    st.setTextZoom(100);\n    web.setInitialScale(100);\n    web.post(() -> {{\n      String u=web.getUrl();\n      if (u == null || !u.contains("bulut-mesaj-temiz-git-v-fb8871")) web.loadUrl(VITRIN_URL);\n    }});\n  }}\n}}\n'''
          m.write_text(code)
          print('Patched', m)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Verify APK signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VITRIN-Android-WebView-Tam-Ekran-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
