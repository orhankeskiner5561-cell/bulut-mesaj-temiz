name: VITRIN Android Workcopy Jitter Fix APK

on:
  push:
    branches:
      - vitrin-android-workcopy-2026-08-31
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare local VITRIN web bundle
        run: |
          rm -rf www
          mkdir -p www
          rsync -a ../ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android-app' \
            --exclude 'node_modules'
          cp vitrin-android-runtime.js www/vitrin-android-runtime.js
          cp vitrin-android-instagram-flow.js www/vitrin-android-instagram-flow.js
          cp vitrin-android-prepaint.css www/vitrin-android-prepaint.css
          python3 - <<'PY'
          from pathlib import Path
          css='<link rel="stylesheet" href="vitrin-android-prepaint.css?v=4">'
          scripts=['<script src="vitrin-android-runtime.js?v=5"></script>','<script src="vitrin-android-instagram-flow.js?v=5"></script>']
          for p in Path('www').glob('*.html'):
              s=p.read_text()
              for old in [
                  '<script src="vitrin-android-runtime.js?v=1"></script>',
                  '<script src="vitrin-android-runtime.js?v=2"></script>',
                  '<script src="vitrin-android-runtime.js?v=3"></script>',
                  '<script src="vitrin-android-runtime.js?v=4"></script>',
                  '<script src="vitrin-android-instagram-flow.js?v=3"></script>',
                  '<script src="vitrin-android-instagram-flow.js?v=4"></script>'
              ]:
                  s=s.replace(old,'')
              if css not in s:
                  s=s.replace('</head>',css+'\n</head>',1) if '</head>' in s else css+'\n'+s
              for tag in scripts:
                  if tag not in s:
                      s=s.replace('</body>',tag+'\n</body>',1) if '</body>' in s else s+'\n'+tag+'\n'
              p.write_text(s)
          PY
          test -f www/index.html
          test -f www/reels.html
          test -f www/vitrin-android-prepaint.css

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = marker + '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          s = s.replace(marker, perms, 1)
          s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="portrait"', 1)
          manifest.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VITRIN-Android-Workcopy-Jitter-Fix-2026-08-31
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
