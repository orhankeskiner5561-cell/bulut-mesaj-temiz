name: VITRIN Android No Reels Tab Fix2 APK

on:
  push:
    branches:
      - vitrin-android-no-reels-tab-fix2-2026-08-31
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare local VITRIN web bundle
        run: |
          rm -rf www
          mkdir -p www
          rsync -a ../ www/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android-app' \
            --exclude 'node_modules'
          cp vitrin-android-runtime.js www/vitrin-android-runtime.js
          python3 - <<'PY'
          from pathlib import Path
          tag='<script src="vitrin-android-runtime.js?v=1"></script>'
          for p in Path('www').glob('*.html'):
              s=p.read_text()
              if tag not in s:
                  if '</body>' in s:
                      s=s.replace('</body>',tag+'\n</body>',1)
                  else:
                      s += '\n'+tag+'\n'
                  p.write_text(s)
          PY
          test -f www/index.html
          test -f www/vitrin-android-runtime.js

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = marker + '\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          s = s.replace(marker, perms, 1)
          s = s.replace('android:exported="true"', 'android:exported="true" android:screenOrientation="portrait"', 1)
          manifest.write_text(s)
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Verify APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VITRIN-Android-No-Reels-Tab-Fix2-APK
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
