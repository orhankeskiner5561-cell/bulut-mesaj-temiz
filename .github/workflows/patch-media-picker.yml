name: Patch BULUT media picker
on:
  push:
    paths:
      - '.github/workflows/patch-media-picker.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch media controls
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('bulut-modern-ui.js')
          s=p.read_text()
          marker='  new MutationObserver(()=>{modernizeNotifications();addChatTools()}).observe(document.documentElement,{subtree:true,childList:true});'
          block=r'''
  // Gönderi oluştur ekranı: kamera + galeri fotoğraf + video erişimi.
  const setupPostMediaPicker=()=>{
    const modal=document.getElementById('cm');
    const up=modal?.querySelector('.up');
    const pf=document.getElementById('pf');
    const vid=document.getElementById('vid');
    if(!modal||!up||!pf||up.dataset.mediaReady==='1')return;
    up.dataset.mediaReady='1';
    up.style.gridTemplateColumns='repeat(2,minmax(0,1fr))';

    // Mevcut fotoğraf seçiciyi galeri fotoğrafı olarak koru.
    const photoLabel=up.querySelector('label[for="pf"]');
    if(photoLabel)photoLabel.innerHTML='🖼️ Galeriden Fotoğraf';

    // Telefon kamerasını doğrudan açan ayrı giriş.
    const camera=document.createElement('input');
    camera.type='file';
    camera.accept='image/*';
    camera.setAttribute('capture','environment');
    camera.id='bulutCameraInput';
    camera.hidden=true;
    modal.querySelector('.box')?.appendChild(camera);

    const cameraBtn=document.createElement('button');
    cameraBtn.type='button';
    cameraBtn.id='bulutCameraBtn';
    cameraBtn.textContent='📷 Kamera';
    up.insertBefore(cameraBtn,up.firstChild);
    cameraBtn.onclick=()=>camera.click();

    camera.onchange=()=>{
      const f=camera.files?.[0];
      if(!f)return;
      try{
        const dt=new DataTransfer();
        dt.items.add(f);
        pf.files=dt.files;
        pf.dispatchEvent(new Event('change',{bubbles:true}));
      }catch(err){
        console.error('BULUT camera transfer',err);
        if(typeof toast==='function')toast('Fotoğraf kameradan alındı ancak eklenemedi.');
      }
    };

    // Video galerisi mevcut Reels yükleyicisine gider; orada video/* seçici açılır.
    if(vid){
      vid.textContent='🎥 Galeriden Video';
      vid.onclick=()=>{ location.href='reels.html?upload=1'; };
    }
  };
  setupPostMediaPicker();
'''
          if 'const setupPostMediaPicker=' not in s:
              s=s.replace(marker,block+'\n'+marker)
              p.write_text(s)

          r=Path('reels.html')
          t=r.read_text()
          hook="$('#pickBtn').onclick=()=>{if(!session){alert('Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return}$('#file').click()};"
          auto="""\n// Ana gönderi ekranından video seçimine gelindiyse galeri seçicisini otomatik aç.\nif(new URLSearchParams(location.search).get('upload')==='1'){\n  setTimeout(()=>{\n    if(session) document.getElementById('file')?.click();\n    else { alert('Video yüklemek için önce BULUT hesabınıza giriş yapın.'); location.href='index.html#login'; }\n  },450);\n}\n"""
          if "get('upload')==='1'" not in t:
              t=t.replace(hook,hook+auto)
              r.write_text(t)
          PY
      - name: Commit patch
        run: |
          git config user.name "bulut-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bulut-modern-ui.js reels.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable camera and gallery media access in post composer"
          git push
