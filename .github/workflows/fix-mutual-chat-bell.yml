name: BULUT sohbet ve zil duzeltme

on:
  push:
    paths:
      - '.github/workflows/fix-mutual-chat-bell.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Duzeltmeyi uygula
        run: python3 .github/scripts/fix_mutual_chat_bell.py
      - name: Kaydet
        run: |
          git config user.name "BULUT Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "Karsilikli takip sohbet ve zil bildirimlerini duzelt"
            git push
          fi
