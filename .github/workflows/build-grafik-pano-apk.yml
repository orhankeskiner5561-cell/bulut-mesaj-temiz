name: Build Grafik Pano APK

on:
  push:
    branches:
      - trading-panel-apk-v1
    paths:
      - 'android-trading-panel/**'
      - '.github/workflows/build-grafik-pano-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V5 live Binance terminal
        working-directory: android-trading-panel
        run: python3 v5_live_patch.py

      - name: Build debug APK
        working-directory: android-trading-panel
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-trading-panel/app/build/outputs/apk/debug/app-debug.apk Grafik-Pano-Live-V5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pano-Live-V5-APK
          path: Grafik-Pano-Live-V5.apk
          if-no-files-found: error
