name: Build Grafik Pano APK

on:
  push:
    branches:
      - trading-panel-apk-v1
    paths:
      - 'android-trading-panel/**'
      - '.github/workflows/build-grafik-pano-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V5 live Binance terminal
        working-directory: android-trading-panel
        run: python3 v5_live_patch.py

      - name: Apply V6 UI interaction patch
        working-directory: android-trading-panel
        run: python3 v6_ui_patch.py

      - name: Apply V7 continuous chart pan patch
        working-directory: android-trading-panel
        run: python3 v7_pan_patch.py

      - name: Apply V8 smooth pan stabilization
        working-directory: android-trading-panel
        run: python3 v8_smooth_pan_patch.py

      - name: Apply V9 pinch history fullscreen PA engine
        working-directory: android-trading-panel
        run: python3 v9_runner_fix.py

      - name: Apply V10 deep zoom 360 free pan
        working-directory: android-trading-panel
        run: python3 v10_freepan_deepzoom_patch.py

      - name: Apply V13 robust live candles and countdown
        working-directory: android-trading-panel
        run: python3 v13_live_candles_countdown_patch.py

      - name: Apply V14 full Price Action all-timeframe engine
        working-directory: android-trading-panel
        run: python3 v14_full_price_action_mtf_patch.py

      - name: Apply V14.1 runtime and pinch hotfix
        working-directory: android-trading-panel
        run: python3 v14_1_runtime_hotfix.py

      - name: Apply V15 anchored stable gestures full history and trade strip
        working-directory: android-trading-panel
        run: python3 v15_anchor_zoom_trade_strip_patch.py

      - name: Build debug APK
        working-directory: android-trading-panel
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-trading-panel/app/build/outputs/apk/debug/app-debug.apk Grafik-Pano-Live-V15.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pano-Live-V15-APK
          path: Grafik-Pano-Live-V15.apk
          if-no-files-found: error
