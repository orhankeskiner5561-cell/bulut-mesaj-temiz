name: Fix Own Story View vs Add
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Separate own story viewing from adding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('bulut-stories.js')
          s=p.read_text()
          s=s.replace("<div class=\"storyCreateBtns\"><button id=\"bulutStoryPhoto\">🖼️ Fotoğraf</button><button id=\"bulutStoryVideo\">🎥 Video</button></div>","<div class=\"storyCreateBtns\"><button id=\"bulutStoryPhoto\">🖼️ Fotoğraf Hikâyesi</button><button id=\"bulutStoryVideo\">🎥 Video Hikâyesi</button></div>",1)
          old="""      strip.innerHTML=html;\n      $('#bulutOwnStory').onclick=()=>$('#bulutStoryCreate').classList.add('on');\n      strip.querySelectorAll('[data-story-user]').forEach(el=>el.onclick=()=>{const idx=storyGroups.findIndex(g=>g.userId===el.dataset.storyUser);if(idx>=0)openViewer(idx,0)});"""
          new="""      strip.innerHTML=html;\n      const ownIdx=storyGroups.findIndex(g=>g.userId===uid);\n      const ownEl=$('#bulutOwnStory');\n      ownEl.onclick=e=>{\n        if(e.target.closest('.addDot'))return;\n        if(ownIdx>=0)openViewer(ownIdx,0);\n        else $('#bulutStoryCreate').classList.add('on');\n      };\n      const addEl=ownEl.querySelector('.addDot');\n      if(addEl)addEl.onclick=e=>{e.stopPropagation();$('#bulutStoryCreate').classList.add('on')};\n      strip.querySelectorAll('[data-story-user]').forEach(el=>el.onclick=()=>{const idx=storyGroups.findIndex(g=>g.userId===el.dataset.storyUser);if(idx>=0)openViewer(idx,0)});"""
          if old not in s: raise SystemExit('own story handler block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name "bulut-story-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bulut-stories.js
          git commit -m "Separate own story viewing from story adding"
          git push
