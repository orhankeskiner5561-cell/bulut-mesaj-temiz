name: Install Reels Studio Preview
on:
  push:
    branches: [VITRIN-REELS-STUDIO-DENEME]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: VITRIN-REELS-STUDIO-DENEME
      - name: Inject studio assets safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('reels.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="vitrin-reels-studio.css?v=1">'
          js='<script src="vitrin-reels-studio.js?v=1"></script>'
          changed=False
          if css not in s:
              s=s.replace('</head>',css+'\n</head>',1); changed=True
          if js not in s:
              s=s.replace('</body>',js+'\n</body>',1); changed=True
          if changed: p.write_text(s)
          PY
      - name: Commit only reels.html injection
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "vitrin-reels-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels.html
          git commit -m "Enable Reels Studio preview without changing existing app logic"
          git push