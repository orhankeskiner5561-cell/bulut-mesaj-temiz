name: Enable Reels photo upload
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add photo support without changing existing reels behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reels.html')
          s=p.read_text()

          replacements = [
            ('<button class="upload" id="pickBtn">＋ Reel Yükle</button>', '<button class="upload" id="pickBtn">＋ Fotoğraf / Reel</button>'),
            ('<div id="chosen" style="font-weight:700;margin-bottom:8px">Video seçilmedi</div>', '<div id="chosen" style="font-weight:700;margin-bottom:8px">Fotoğraf veya video seçilmedi</div>'),
            ('<input id="file" type="file" accept="video/*" hidden>', '<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,video/*" hidden>'),
            ('.reel video{width:100%;height:100%;object-fit:cover;background:#222}', '.reel video,.reel img{width:100%;height:100%;object-fit:cover;background:#222}'),
            ("Henüz Reel yok. İlk videoyu siz yükleyin ☁️", "Henüz paylaşım yok. İlk fotoğrafı veya videoyu siz yükleyin ☁️"),
          ]
          for old,new in replacements:
            if old not in s:
              raise SystemExit('Beklenen parça bulunamadı: '+old[:80])
            s=s.replace(old,new,1)

          old="function render(){if(!reels.length){$('#feed').innerHTML='<div class=\"empty\">Henüz paylaşım yok. İlk fotoğrafı veya videoyu siz yükleyin ☁️</div>';return}$('#feed').innerHTML=reels.map(r=>{const p=profiles[r.user_id]||{username:'bulut'},count=likes.filter(x=>x.reel_id===r.id).length,commentCount=comments.filter(x=>x.reel_id===r.id).length,liked=!!(session&&likes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id));return `<div class=\"reelWrap\"><article class=\"reel\" data-id=\"${r.id}\"><video src=\"${esc(r.video_url)}\" controls playsinline loop preload=\"metadata\"></video>"
          new="function isPhotoReel(r){return r?.sound_title==='Fotoğraf'||/\\.(jpe?g|png|webp|gif|avif)(?:\\?|$)/i.test(r?.video_url||'')}\nfunction reelMedia(r){return isPhotoReel(r)?`<img src=\"${esc(r.video_url)}\" alt=\"BULUT fotoğraf\" loading=\"lazy\">`:`<video src=\"${esc(r.video_url)}\" controls playsinline loop preload=\"metadata\"></video>`}\nfunction render(){if(!reels.length){$('#feed').innerHTML='<div class=\"empty\">Henüz paylaşım yok. İlk fotoğrafı veya videoyu siz yükleyin ☁️</div>';return}$('#feed').innerHTML=reels.map(r=>{const p=profiles[r.user_id]||{username:'bulut'},count=likes.filter(x=>x.reel_id===r.id).length,commentCount=comments.filter(x=>x.reel_id===r.id).length,liked=!!(session&&likes.some(x=>x.reel_id===r.id&&x.user_id===session.user.id));return `<div class=\"reelWrap\"><article class=\"reel\" data-id=\"${r.id}\">${reelMedia(r)}"
          if old not in s:
            raise SystemExit('Render video parçası bulunamadı')
          s=s.replace(old,new,1)

          old="function updateChosenText(){if(!selectedFile)return;const mb=(selectedFile.size/1048576).toFixed(1);$('#chosen').textContent='Seçildi: '+selectedFile.name+' · '+mb+' MB · '+(uploadMode==='original'?'Orijinal kalite':selectedFile.size>48*1048576?'Kalite korunarak otomatik sıkıştırılacak':'Orijinal dosya aynen yüklenecek')}"
          new="function updateChosenText(){if(!selectedFile)return;const mb=(selectedFile.size/1048576).toFixed(1),photo=selectedFile.type.startsWith('image/');$('#chosen').textContent='Seçildi: '+selectedFile.name+' · '+mb+' MB · '+(photo?'Fotoğraf':uploadMode==='original'?'Orijinal kalite':selectedFile.size>48*1048576?'Kalite korunarak otomatik sıkıştırılacak':'Orijinal dosya aynen yüklenecek')}"
          if old not in s: raise SystemExit('updateChosenText bulunamadı')
          s=s.replace(old,new,1)

          old="$('#autoMode').onclick=()=>setUploadMode('auto');$('#originalMode').onclick=()=>setUploadMode('original');$('#pickBtn').onclick=()=>{if(!session){alert('Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return}$('#file').click()};$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;selectedFile=f;updateChosenText();$('#composer').classList.add('on')};$('#cancelBtn').onclick=()=>{selectedFile=null;$('#file').value='';$('#caption').value='';setUploadMode('auto');$('#composer').classList.remove('on')};"
          new="$('#autoMode').onclick=()=>setUploadMode('auto');$('#originalMode').onclick=()=>setUploadMode('original');$('#pickBtn').onclick=()=>{if(!session){alert('Fotoğraf veya Reel yüklemek için önce BULUT hesabınıza giriş yapın.');location.href='index.html#login';return}$('#file').click()};$('#file').onchange=e=>{const f=e.target.files?.[0];if(!f)return;selectedFile=f;$('.modeBox').style.display=f.type.startsWith('image/')?'none':'';updateChosenText();$('#composer').classList.add('on')};$('#cancelBtn').onclick=()=>{selectedFile=null;$('#file').value='';$('#caption').value='';$('.modeBox').style.display='';setUploadMode('auto');$('#composer').classList.remove('on')};"
          if old not in s: raise SystemExit('Dosya seçici bölümü bulunamadı')
          s=s.replace(old,new,1)

          old="$('#publishBtn').onclick=async()=>{if(!session||!selectedFile)return;const btn=$('#publishBtn');if(uploadMode==='original'&&selectedFile.size>48*1048576){alert('Bu video 48 MB sınırının üzerinde. Otomatik seçeneğini kullanın.');return}btn.disabled=true;try{const uploadFile=uploadMode==='original'?selectedFile:await compressVideoIfNeeded(selectedFile);btn.textContent='Yükleniyor…';const ext=(uploadFile.name.split('.').pop()||'webm').toLowerCase(),path=`${session.user.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`,up=await sb.storage.from('reels').upload(path,uploadFile,{contentType:uploadFile.type||'video/webm',upsert:false});if(up.error)throw up.error;const video_url=sb.storage.from('reels').getPublicUrl(path).data.publicUrl,caption=$('#caption').value.trim(),ins=await sb.from('reels').insert({user_id:session.user.id,video_url,storage_path:path,caption,sound_title:'Orijinal Ses',status:'published'});if(ins.error)throw ins.error;selectedFile=null;$('#file').value='';$('#caption').value='';$('#composer').classList.remove('on');alert('Reel yayınlandı ☁️');await loadAll()}catch(e){alert('Reel yüklenemedi: '+(e.message||'Bilinmeyen hata'))}finally{btn.disabled=false;btn.textContent='Yayınla'}};"
          new="$('#publishBtn').onclick=async()=>{if(!session||!selectedFile)return;const btn=$('#publishBtn'),isPhoto=selectedFile.type.startsWith('image/');if(selectedFile.size>48*1048576&&(isPhoto||uploadMode==='original')){alert(isPhoto?'Bu fotoğraf 48 MB sınırının üzerinde.':'Bu video 48 MB sınırının üzerinde. Otomatik seçeneğini kullanın.');return}btn.disabled=true;try{const uploadFile=isPhoto||uploadMode==='original'?selectedFile:await compressVideoIfNeeded(selectedFile);btn.textContent='Yükleniyor…';const ext=(uploadFile.name.split('.').pop()||(isPhoto?'jpg':'webm')).toLowerCase(),path=`${session.user.id}/${Date.now()}-${crypto.randomUUID()}.${ext}`,up=await sb.storage.from('reels').upload(path,uploadFile,{contentType:uploadFile.type||(isPhoto?'image/jpeg':'video/webm'),upsert:false});if(up.error)throw up.error;const video_url=sb.storage.from('reels').getPublicUrl(path).data.publicUrl,caption=$('#caption').value.trim(),ins=await sb.from('reels').insert({user_id:session.user.id,video_url,storage_path:path,caption,sound_title:isPhoto?'Fotoğraf':'Orijinal Ses',status:'published'});if(ins.error)throw ins.error;selectedFile=null;$('#file').value='';$('#caption').value='';$('.modeBox').style.display='';$('#composer').classList.remove('on');alert(isPhoto?'Fotoğraf yayınlandı ☁️':'Reel yayınlandı ☁️');await loadAll()}catch(e){alert('Yükleme başarısız: '+(e.message||'Bilinmeyen hata'))}finally{btn.disabled=false;btn.textContent='Yayınla'}};"
          if old not in s: raise SystemExit('Yayınlama bölümü bulunamadı')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name "bulut-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reels.html
          git commit -m "Enable photo uploads in Reels while preserving video behavior"
          git push
