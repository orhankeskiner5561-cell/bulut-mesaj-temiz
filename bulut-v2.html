<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d8cff">
<title>BULUT V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#2d8cff;--c:#54c8ff;--n:#10233f;--m:#71829a;--l:#dfeaf6;--bg:#f2f8ff;--card:#fff;--danger:#e5484d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(#f9fcff,#eef7ff);color:var(--n);padding-bottom:76px}button,input,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:50;height:78px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fff;border-bottom:1px solid var(--l)}.brand{display:flex;align-items:center;gap:7px;font-weight:950}.cloud{width:72px;height:54px;border:3px solid #20bfd0;border-radius:22px;background:#eaffff;display:grid;place-items:center;font-size:34px;animation:float 2.8s ease-in-out infinite}.brandName{font-size:23px;background:linear-gradient(90deg,#18bfcf,#2d8cff);-webkit-background-clip:text;color:transparent}.tr{font-size:20px;color:#e30a17}@keyframes float{50%{transform:translateY(-3px)}}.actions{display:flex;gap:6px}.ib{border:0;background:#eef7ff;border-radius:14px;width:42px;height:42px;display:grid;place-items:center;position:relative}.badge{position:absolute;right:-4px;top:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}.wrap{max-width:720px;margin:auto;padding:12px}.page{display:none}.page.on{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:22px;box-shadow:0 10px 30px #2a65a018;padding:16px;margin-bottom:14px}.loading,.empty{text-align:center;color:var(--m);padding:28px}.bottom{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fffffff7;border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(5,1fr);z-index:40}.bottom button{border:0;background:transparent;color:var(--m);font-size:11px}.bottom button.on{color:var(--b);font-weight:900}.bottom span{display:block;font-size:21px}.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--b),#735cff);color:#fff;font-weight:800;display:grid;place-items:center;overflow:hidden;flex:0 0 46px}.av img{width:100%;height:100%;object-fit:cover}.feedCard{padding:14px}.head{display:flex;gap:10px;align-items:center}.head .meta{flex:1}.head b{display:block}.muted{color:var(--m)}.media{width:100%;max-height:560px;object-fit:cover;border-radius:18px;margin-top:12px}.reel{aspect-ratio:9/16;background:#182536}.primary,.outline{border:0;border-radius:13px;padding:10px 14px;font-weight:800}.primary{background:linear-gradient(135deg,var(--b),var(--c));color:#fff}.outline{background:#fff;border:1px solid var(--l);color:var(--n)}.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.row:last-child{border-bottom:0}.chatPanel{padding:0;overflow:hidden}.chatHead{display:grid;grid-template-columns:42px 48px 1fr;gap:9px;align-items:center;padding:12px;border-bottom:1px solid var(--l);background:#fbfdff}.clickable{cursor:pointer}.chatMessages{height:min(58vh,520px);min-height:330px;overflow:auto;padding:14px;background:linear-gradient(#f8fbff,#eef7ff);display:flex;flex-direction:column;gap:8px}.bubble{max-width:82%;padding:9px 12px;border-radius:17px;background:#fff;border:1px solid var(--l);align-self:flex-start}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,var(--b),var(--c));color:#fff;border-color:transparent}.bt{font-size:10px;opacity:.7;text-align:right;margin-top:4px}.chatComposer{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px;border-top:1px solid var(--l);background:#fff}.chatComposer textarea{resize:none;border:1px solid var(--l);border-radius:16px;padding:11px;outline:0}.modal{display:none;position:fixed;inset:0;z-index:80}.modal.on{display:block}.backdrop{position:absolute;inset:0;background:#0b223b77;backdrop-filter:blur(5px)}.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:18px}.mh{display:flex;align-items:center;justify-content:space-between}.summary{background:#fff8df;border:1px solid #f2d67c;border-radius:14px;padding:12px;margin:10px 0}.profileBox{text-align:center}.profileBox .av{width:96px;height:96px;margin:8px auto;font-size:30px}.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,20px);background:#10233f;color:#fff;border-radius:999px;padding:10px 14px;opacity:0;transition:.2s;z-index:100}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="cloud">☁️</div><span class="brandName">BULUT</span><span class="tr">TR 🇹🇷</span></div><div class="actions"><button class="ib" id="bell">🔔<span class="badge" id="badge" hidden>0</span></button><button class="ib" data-route="messages">💬</button><button class="ib" data-route="profile">👤</button></div></header>
<main class="wrap">
<section class="page on" id="home"><div class="card"><h2 style="margin-top:0">Ana Akış</h2><div id="feed"><div class="loading">Yükleniyor…</div></div></div></section>
<section class="page" id="reels"><div class="card"><h2>Reels</h2><div id="reelFeed"><div class="loading">Yükleniyor…</div></div></div></section>
<section class="page" id="agenda"><div class="card"><h2>Gündem</h2><p class="muted">Yeni temiz sürümde hazırlanıyor.</p></div></section>
<section class="page" id="rooms"><div class="card"><h2>Odalar</h2><p class="muted">Yeni temiz sürümde hazırlanıyor.</p></div></section>
<section class="page" id="messages"><div class="card" id="chatListCard"><div class="mh"><div><h2 style="margin:0">Mesajlar</h2><p class="muted" style="margin:4px 0 0">Tek kişi = tek sohbet</p></div><button class="ib" id="refreshChats">↻</button></div><div id="chatList"></div></div><div class="card chatPanel" id="chatPanel" hidden><div class="chatHead"><button class="ib" id="chatBack">←</button><div class="av clickable" id="chatAvatar">?</div><div class="clickable" id="chatIdentity"><b id="chatName">Sohbet</b><div class="muted" id="chatUser"></div></div></div><div class="chatMessages" id="chatMessages"></div><form class="chatComposer" id="chatForm"><textarea id="chatInput" rows="1" maxlength="2000" placeholder="Mesaj yaz..."></textarea><button class="primary">Gönder</button></form></div></section>
<section class="page" id="profile"><div class="card profileBox" id="profileBox"><div class="loading">Profil yükleniyor…</div></div></section>
</main>
<nav class="bottom"><button data-route="home" class="on"><span>🏠</span>Ana Akış</button><button data-route="reels"><span>🎬</span>Reels</button><button data-route="agenda"><span>🔥</span>Gündem</button><button data-route="rooms"><span>💬</span>Odalar</button><button data-route="profile"><span>👤</span>Profil</button></nav>
<div class="modal" id="notifModal"><div class="backdrop" data-close="notifModal"></div><div class="box"><div class="mh"><h2>Bildirimler</h2><button class="ib" data-close="notifModal">✕</button></div><div id="notifContent"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://wtkiozzylhvphxenrpwq.supabase.co';
const SUPABASE_KEY='sb_publishable_pDW5FSXya-HqQDl4pI4lAQ_Hdm7yptb';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let session=null,me=null,profiles={},currentChat=null,currentOther=null,msgChannel=null,notifChannel=null,historyLock=false;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.__t);window.__t=setTimeout(()=>e.classList.remove('on'),2200)}
function avatar(p){return p?.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p?.full_name||p?.username||'?')[0].toUpperCase())}
function showPage(name,push=true){$$('.page').forEach(x=>x.classList.toggle('on',x.id===name));$$('[data-route]').forEach(x=>x.classList.toggle('on',x.dataset.route===name));if(push&&!historyLock)history.pushState({page:name},'',`#${name}`);if(name==='messages')loadChats();if(name==='profile')renderProfile(me?.id);scrollTo(0,0)}
document.addEventListener('click',e=>{const r=e.target.closest('[data-route]');if(r)showPage(r.dataset.route);const c=e.target.closest('[data-close]');if(c)$('#'+c.dataset.close).classList.remove('on')});
window.addEventListener('popstate',()=>{if(!$('#chatPanel').hidden){closeChat(false);return}historyLock=true;showPage(location.hash.slice(1)||'home',false);historyLock=false});
async function loadProfile(id){if(profiles[id])return profiles[id];const {data}=await sb.from('profiles').select('id,full_name,username,avatar_url,bio,city').eq('id',id).maybeSingle();if(data)profiles[id]=data;return data}
async function boot(){showPage(location.hash.slice(1)||'home',false);const {data:{session:s}}=await sb.auth.getSession();session=s;if(session){me=await loadProfile(session.user.id);await Promise.all([loadFeed(),loadReels(),refreshBell()]);setupRealtime()}else{await Promise.all([loadFeed(),loadReels()]);$('#badge').hidden=true}sb.auth.onAuthStateChange(async(_e,s2)=>{session=s2;me=s2?await loadProfile(s2.user.id):null;await refreshBell();setupRealtime()})}
async function loadFeed(){const root=$('#feed');const [{data:posts,error:pe},{data:reels,error:re}]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}).limit(40),sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(20)]);if(pe||re){root.innerHTML='<div class="empty">Akış yüklenemedi.</div>';return}const items=[...(posts||[]).map(x=>({...x,_k:'p'})),...(reels||[]).map(x=>({...x,_k:'r'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));for(const x of items)await loadProfile(x.user_id);root.innerHTML=items.length?items.map(x=>feedHtml(x)).join(''):'<div class="empty">Henüz gönderi yok.</div>';setupAutoPlay()}
function feedHtml(x){const p=profiles[x.user_id]||{};return `<article class="card feedCard"><div class="head clickable" data-profile="${x.user_id}"><div class="av">${avatar(p)}</div><div class="meta"><b>${esc(p.full_name||'Üye')}</b><span class="muted">@${esc(p.username||'uye')}</span></div></div>${x._k==='p'?`<p>${esc(x.body||'')}</p>${x.image_url?`<img class="media" loading="lazy" src="${esc(x.image_url)}">`:''}`:`<p>🎬 ${esc(x.caption||'BULUT Reels')}</p><video class="media reel" src="${esc(x.video_url)}" playsinline muted preload="metadata" controls></video>`}</article>`}
async function loadReels(){const root=$('#reelFeed');const {data,error}=await sb.from('reels').select('*').eq('status','published').order('created_at',{ascending:false}).limit(30);if(error){root.innerHTML='<div class="empty">Reels yüklenemedi.</div>';return}for(const x of data||[])await loadProfile(x.user_id);root.innerHTML=(data||[]).map(x=>feedHtml({...x,_k:'r'})).join('')||'<div class="empty">Henüz Reel yok.</div>';setupAutoPlay()}
function setupAutoPlay(){const vids=$$('video.reel');if(!vids.length)return;const ob=new IntersectionObserver(entries=>{for(const e of entries){if(e.intersectionRatio>.65){vids.forEach(v=>v!==e.target&&v.pause());e.target.play().catch(()=>{})}else if(e.intersectionRatio<.25)e.target.pause()}},{threshold:[0,.25,.65,1]});vids.forEach(v=>ob.observe(v))}
document.addEventListener('click',e=>{const p=e.target.closest('[data-profile]');if(p)renderProfile(p.dataset.profile)});
async function renderProfile(id){if(!id)return toast('Giriş yapmalısınız.');const p=await loadProfile(id);if(!p)return;showPage('profile');$('#profileBox').innerHTML=`<div class="av">${avatar(p)}</div><h2>${esc(p.full_name||'Üye')}</h2><div class="muted">@${esc(p.username||'uye')}${p.city?' · '+esc(p.city):''}</div><p>${esc(p.bio||'Bulut’a yeni katıldı ☁️')}</p>`}
async function acceptedChats(){const {data,error}=await sb.from('chat_requests').select('*').or(`sender_id.eq.${session.user.id},receiver_id.eq.${session.user.id}`).eq('status','accepted').order('created_at',{ascending:false});if(error)throw error;const seen=new Set(),out=[];for(const r of data||[]){const other=r.sender_id===session.user.id?r.receiver_id:r.sender_id;if(seen.has(other))continue;seen.add(other);out.push({...r,_other:other})}return out}
async function loadChats(){const root=$('#chatList');if(!session){root.innerHTML='<div class="empty">Mesajları görmek için giriş yapın.</div>';return}root.innerHTML='<div class="loading">Yükleniyor…</div>';try{const chats=await acceptedChats();for(const r of chats)await loadProfile(r._other);root.innerHTML=chats.length?chats.map(r=>{const p=profiles[r._other]||{};return `<div class="row"><div class="av clickable" data-profile="${r._other}">${avatar(p)}</div><div class="clickable" data-profile="${r._other}"><b>${esc(p.full_name||'Üye')}</b><div class="muted">@${esc(p.username||'uye')}</div></div><button class="primary" data-chat="${r.id}">Aç</button></div>`}).join(''):'<div class="empty">Henüz sohbet yok.</div>';$$('[data-chat]').forEach(b=>b.onclick=()=>openChat(b.dataset.chat))}catch(e){console.error(e);root.innerHTML='<div class="empty">Sohbetler yüklenemedi.</div>'}}
async function openChat(id){const {data:r,error}=await sb.from('chat_requests').select('*').eq('id',id).maybeSingle();if(error||!r||r.status!=='accepted')return toast('Sohbet açılamadı.');const other=r.sender_id===session.user.id?r.receiver_id:r.sender_id;currentChat=r;currentOther=await loadProfile(other);$('#chatAvatar').innerHTML=avatar(currentOther);$('#chatName').textContent=currentOther?.full_name||'Üye';$('#chatUser').textContent='@'+(currentOther?.username||'uye');$('#chatListCard').hidden=true;$('#chatPanel').hidden=false;history.pushState({chat:id},'',`#messages/chat/${id}`);await loadMessages(true);if(msgChannel)await sb.removeChannel(msgChannel);msgChannel=sb.channel('v2-chat-'+id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`chat_request_id=eq.${id}`},()=>loadMessages(true)).subscribe()}
async function loadMessages(markRead){if(!currentChat)return;const {data,error}=await sb.from('messages').select('*').eq('chat_request_id',currentChat.id).order('created_at',{ascending:true}).limit(500);if(error)return;const rows=data||[];$('#chatMessages').innerHTML=rows.map(m=>{const mine=m.sender_id===session.user.id,t=new Date(m.created_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});return `<div class="bubble ${mine?'mine':''}">${esc(m.body)}<div class="bt">${t}${mine&&m.read_at?' · Görüldü':''}</div></div>`}).join('')||'<div class="empty">İlk mesajı siz gönderin.</div>';$('#chatMessages').scrollTop=$('#chatMessages').scrollHeight;if(markRead){const unread=rows.filter(m=>m.sender_id!==session.user.id&&!m.read_at).map(m=>m.id);if(unread.length)await sb.from('messages').update({read_at:new Date().toISOString(),delivered_at:new Date().toISOString()}).in('id',unread);await sb.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id',session.user.id).eq('actor_id',currentOther.id).eq('type','message').is('read_at',null);await refreshBell()}}
$('#chatForm').onsubmit=async e=>{e.preventDefault();const body=$('#chatInput').value.trim();if(!body||!currentChat)return;const {error}=await sb.from('messages').insert({chat_request_id:currentChat.id,sender_id:session.user.id,body});if(error)return toast('Mesaj gönderilemedi.');$('#chatInput').value='';await loadMessages(false)};
async function closeChat(useBack=true){if(msgChannel){await sb.removeChannel(msgChannel);msgChannel=null}currentChat=null;currentOther=null;$('#chatPanel').hidden=true;$('#chatListCard').hidden=false;await loadChats();if(useBack&&location.hash.includes('/chat/'))history.back()}
$('#chatBack').onclick=()=>closeChat(true);$('#refreshChats').onclick=loadChats;$('#chatAvatar').onclick=()=>currentOther&&renderProfile(currentOther.id);$('#chatIdentity').onclick=()=>currentOther&&renderProfile(currentOther.id);
async function unreadState(){if(!session)return{senders:[],messageCount:0,otherCount:0};const [{data:msgs},{data:notifs}]=await Promise.all([sb.from('messages').select('id,sender_id,read_at').neq('sender_id',session.user.id).is('read_at',null),sb.from('notifications').select('id,actor_id,type,read_at').eq('user_id',session.user.id).is('read_at',null)]);const senders=[...new Set((msgs||[]).map(x=>x.sender_id))];const other=(notifs||[]).filter(n=>n.type!=='message');return{senders,messageCount:(msgs||[]).length,otherCount:other.length,other}}
async function refreshBell(){const b=$('#badge');if(!session){b.hidden=true;return}const s=await unreadState();const total=s.senders.length+s.otherCount;b.textContent=total>99?'99+':String(total);b.hidden=!total}
$('#bell').onclick=async()=>{if(!session)return toast('Giriş yapmalısınız.');$('#notifModal').classList.add('on');await renderNotifications()};
async function renderNotifications(){const root=$('#notifContent');root.innerHTML='<div class="loading">Yükleniyor…</div>';const s=await unreadState();const senderProfiles=[];for(const id of s.senders){const p=await loadProfile(id);if(p)senderProfiles.push(p)}const peopleMsg=senderProfiles.length;let html=`<div class="summary">💬 <b>${s.messageCount} yeni mesaj</b> · ${peopleMsg} kişiden<br>🔔 <b>${s.otherCount} diğer bildirim</b></div>`;if(senderProfiles.length){html+='<h3>Yeni Mesajlar</h3>'+senderProfiles.map(p=>`<div class="row"><div class="av clickable" data-profile="${p.id}">${avatar(p)}</div><div class="clickable" data-profile="${p.id}"><b>${esc(p.full_name)}</b><div class="muted">@${esc(p.username)}</div></div><button class="primary" data-open-person="${p.id}">Mesajlar</button></div>`).join('')}if(s.other?.length){const ids=[...new Set(s.other.map(n=>n.actor_id))];for(const id of ids)await loadProfile(id);html+='<h3>Takip ve Etkileşimler</h3>'+s.other.map(n=>{const p=profiles[n.actor_id]||{};const text=n.type==='follow'?'sizi takip etti.':n.type.includes('like')?'gönderinizi beğendi.':n.type.includes('comment')?'yorum yaptı.':'etkileşimde bulundu.';return `<div class="row"><div class="av clickable" data-profile="${n.actor_id}">${avatar(p)}</div><div><b>${esc(p.full_name||'Üye')}</b> ${text}</div><button class="outline" data-profile="${n.actor_id}">Profil</button></div>`}).join('')}root.innerHTML=html||'<div class="empty">Yeni bildiriminiz yok.</div>';$$('[data-open-person]').forEach(b=>b.onclick=()=>openPersonChat(b.dataset.openPerson));$$('#notifContent [data-profile]').forEach(b=>b.onclick=()=>{$('#notifModal').classList.remove('on');renderProfile(b.dataset.profile)});if(s.other?.length){const ids=s.other.map(n=>n.id);await sb.from('notifications').update({read_at:new Date().toISOString()}).in('id',ids);await refreshBell()}}
async function openPersonChat(otherId){const chats=await acceptedChats();const r=chats.find(x=>x._other===otherId);if(!r)return toast('Bu kişiyle açık sohbet bulunamadı.');$('#notifModal').classList.remove('on');showPage('messages');await openChat(r.id)}
function setupRealtime(){if(notifChannel){sb.removeChannel(notifChannel);notifChannel=null}if(!session)return;notifChannel=sb.channel('v2-notifs-'+session.user.id).on('postgres_changes',{event:'*',schema:'public',table:'notifications',filter:`user_id=eq.${session.user.id}`},refreshBell).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},refreshBell).subscribe()}
boot();
</script>
</body></html>
